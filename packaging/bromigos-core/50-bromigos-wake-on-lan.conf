# bromigOS keeps Wake-on-LAN on for wired network cards (docs/wake-on-lan.md), so a
# switched-off machine with an Ethernet cable can be woken by a "magic packet" from
# another computer on the same network (BRODEC's Power on, for one).
#
# A connection whose own 802-3-ethernet.wake-on-lan is "default" (every connection
# bromigOS and NetworkManager make) follows this. 64 is NetworkManager's "magic" flag
# (0x40, nm-settings-nmcli(5)). Wi-Fi isn't touched: it can't wake a powered-off machine.
#
# To turn it off: put an empty file of the same name in /etc/NetworkManager/conf.d/, and
# set the connection's own value, e.g.
#   nmcli connection modify <name> 802-3-ethernet.wake-on-lan ignore
[connection-bromigos-wake-on-lan]
match-device=type:ethernet
ethernet.wake-on-lan=64
