# bromigOS (package bromigos-boot; docs/console.md): when no graphics device appears, the
# login screen isn't started and the text console takes its place, with a note; when the
# login screen fails, the same. Never a black screen with a blinking cursor.
[Unit]
OnFailure=bromigos-no-graphics.service

[Service]
ExecCondition=/usr/lib/bromigos/console/bromigos-console-hint graphics-ready
