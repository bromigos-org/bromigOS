# bromigOS (package bromigos-boot; docs/console.md): kmscon with bromigOS's settings (Geist Mono,
# DRIFTGLASS in true colour) and bromigOS's login wrapper. Where kmscon can't start (no KMS:
# nomodeset on BIOS, a serial console), kmsconvt@'s own OnFailure starts getty instead, which
# bromigos-console-setup gives the same colours and Geist Mono.
[Service]
ExecStart=
ExecStart=/usr/bin/kmscon --vt=%I --no-switchvt --configdir /usr/share/bromigos/console/kmscon --login -- /usr/lib/bromigos/console/bromigos-console-login %I
