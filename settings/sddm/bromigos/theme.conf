[General]
# The pictures are the Wick's, put in assets/ by packaging/bromigos-settings/PKGBUILD (the
# lock-screen den with the chair empty, the burn-in's ring and flame); paths are relative to
# the theme directory.
background=assets/background.jpg
ring=assets/ring.png
flame=assets/flame.png
caption=TRANSMISSION INTERCEPTED
signoff=STILL LIT.
# Canon motion: the motto ring turns counter-clockwise, one turn per ring_seconds.
ringSeconds=24
# The session chosen when SDDM remembers none (matched against the session name).
defaultSession=Hyprland
# Faint twinkling stars in the den's dark sky (0 = off).
stars=80
# Test only: a directory to save screenshots into, driven by components/TestDriver.qml.
# Empty in every installed theme.
testShots=
