# bromigOS's login screen (package bromigos-settings). Named zz- because SDDM reads this
# directory in name order and the sddm package's own default.conf (Current= empty,
# DisplayServer=x11) would otherwise come after it and win. SDDM reads /usr/lib/sddm/sddm.conf.d
# first, then /etc/sddm.conf.d and /etc/sddm.conf: a machine's own settings there win.
[General]
# the Wayland greeter (Weston as its compositor, SDDM's default)
DisplayServer=wayland

[Wayland]
# Resolve the connected display GPU at each login; local CompositorCommand overrides win.
CompositorCommand=/usr/lib/bromigos/sddm/bromigos-greeter

[Theme]
Current=bromigos
CursorTheme=Bromigos-cursor
