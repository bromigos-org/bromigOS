# bromigOS's idle policy as packaged (bromigos-desktop): /usr/share/bromigos/default/hypr/hypridle.conf.
# Don't edit; updates replace it. The policy is data now: ~/.config/bromigos/idle.toml over
# /usr/share/bromigos/default/idle.toml, rendered by `bromigos idle` into
# ~/.local/state/bromigos/idle/hypridle.conf, which your ~/.config/hypr/hypridle.conf sources
# (`bromigos update` moved it there; docs/idle.md). This file is that policy's defaults,
# rendered, for a hypridle.conf that still sources it. A test keeps the two the same.
#
# Screensaver at 8 min, then the lock at 10 min, then displays off at 15 min. Never suspends.

general {
    lock_cmd = bromigos lock-run   # relaunches the locker if it crashes; you still type your password
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = /usr/lib/bromigos/bin/bromigos-dispatch 'hl.dsp.dpms({ action = "on" })' dpms on
}

# the screensaver: the live scene full screen; any input ends it
listener {
    timeout = 480
    on-timeout = bromigos-live ctl screensaver open
    on-resume = bromigos-live screensaver-off
}

# the lock
listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

# the displays off (Lua dispatchers for hyprland.lua; the old `dpms` form for hyprland.conf)
listener {
    timeout = 900
    on-timeout = /usr/lib/bromigos/bin/bromigos-dispatch 'hl.dsp.dpms({ action = "off" })' dpms off
    on-resume = /usr/lib/bromigos/bin/bromigos-dispatch 'hl.dsp.dpms({ action = "on" })' dpms on
}

# the worlds' keeper and creatures doze without input and wake on the next
listener {
    timeout = 90
    on-timeout = bromigos-live ctl activity idle
    on-resume = bromigos-live ctl activity active
}
