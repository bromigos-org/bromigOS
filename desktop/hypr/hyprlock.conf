# bromigOS's fallback lock screen (package bromigos-desktop): hyprlock runs it when gtklock
# can't start (`bromigos lock-run`). /usr/share/bromigos/default/hypr/hyprlock.conf; don't
# edit, updates replace it. Your ~/.config/hypr/hyprlock.conf sources it.
# ---- BROMIGOS THEME: lock screen -------------------------------------------------
# An intercepted screen: the dimmed den behind soft scanlines, the burn-in as the
# hero (static, tuning gap at 12 o'clock: hyprlock can't rotate an image smoothly),
# a big clock and a terminal-style passphrase line. No notes, names or addresses.
# In markup, '##' is a literal '#' (a single # starts a hyprlang comment).

$void = rgb(000500)
$panel = rgba(001300ee)
$phosphor = rgb(39ff14)
$soft = rgb(9cff8a)
$dim = rgb(159b09)
$amber = rgb(d4af37)
$danger = rgb(ff766f)
$font = Geist Mono

general {
    hide_cursor = true
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = crisp, 0.2, 0.9, 0.1, 1
    animation = fadeIn, 1, 3, crisp
    animation = fadeOut, 1, 3, crisp
    animation = inputFieldDots, 1, 2, crisp
}

background {
    monitor =
    # bromigos-wallpaper keeps this link on the chosen variant (local state, not tracked)
    path = ~/.local/state/bromigos/wallpaper/lock.jpg
    color = $void
    blur_passes = 0
}

# the burn-in (static: the animated loop crashed hyprlock, 2026-10-07; see bromigos-live lockemblem.py)
image {
    monitor =
    # the theme's emblem (a world's post has its own; the theme-set hook
    # /usr/share/bromigos/hooks/theme-set.d/emblem keeps the link)
    path = ~/.local/state/bromigos/emblem/emblem-glow-1024.png
    size = 430
    rounding = 0
    border_size = 0
    position = 0, 260
    halign = center
    valign = center
}

label {
    monitor =
    text = <span letter_spacing="6000">TRANSMISSION INTERCEPTED</span>
    color = $phosphor
    font_size = 15
    font_family = $font Bold
    position = 0, 10
    halign = center
    valign = center
}

# clock
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = $phosphor
    font_size = 104
    font_family = $font Bold
    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(39ff1455)
    position = 0, -130
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] echo "<span letter_spacing='4000'>$(date +'%A %d %B %Y' | tr '[:lower:]' '[:upper:]')</span>"
    color = $soft
    font_size = 13
    font_family = $font SemiBold
    position = 0, -230
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 520, 54
    outline_thickness = 1
    rounding = 0
    outer_color = $phosphor
    inner_color = $panel
    font_color = $soft
    font_family = $font
    check_color = $amber
    fail_color = $danger
    capslock_color = $amber
    dots_size = 0.28
    dots_spacing = 0.45
    dots_center = false
    dots_rounding = 0
    fade_on_empty = false
    placeholder_text = <span foreground="##159b09" letter_spacing="3000">&gt; PASSPHRASE</span>
    check_text = <span foreground="##d4af37" letter_spacing="3000">&gt; VERIFYING</span>
    fail_text = <span foreground="##ff766f" letter_spacing="3000">&gt; REJECTED · $ATTEMPTS</span>
    hide_input = false
    position = 0, -330
    halign = center
    valign = center
}

# sign-off
label {
    monitor =
    text = <span letter_spacing="5000">STILL LIT.</span>
    color = rgba(159b0999)
    font_size = 11
    font_family = $font SemiBold
    position = 0, 36
    halign = center
    valign = bottom
}
# ---- END BROMIGOS THEME: lock screen ---------------------------------------------
