# The manual's Keys and Commands pages, in plain words (tools/docs/generate.py reads this).
#
# The code says WHICH keys and commands exist; this file says how the manual groups them by
# task and explains each one to someone who just installed bromigOS. The generator matches
# each row to the code:
#
#   keys      `match` is the SHORTCUTS panel's description of the bind (widgets/keybinds.py:
#             EXEC and DISPATCH), without any "(also …)" it adds for a second key.
#   commands  `route` is the command after `bromigos` ("theme", "setup input").
#
# A key or command the code has and this file doesn't is still listed, under "Other keys" or
# "Other commands", with the code's own description; a row here that the code no longer has
# is left out. So adding a key or a command never breaks the docs check, but it reads best
# with a row here. British spelling; one short sentence or two per row.

# ------------------------------------------------------------------ keys

