  { id = "protonvpn", title = "Proton VPN", note = "From the Proton Mail team, in Switzerland.", link = "https://protonvpn.com/pricing", fields = ["username", "password", "region"] },
  { id = "mullvad", title = "Mullvad", note = "No email needed; pay with an account number.", link = "https://mullvad.net/en/pricing", fields = ["wireguard_key", "wireguard_address", "region"] },
]

