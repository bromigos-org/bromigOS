# The lab provisioning catalogue, the medium's stand-in (docs/server.md, "What should this
# server run?"). The real one is the lab provisioning engine's: homelab/share/provision-catalogue.toml,
# installed to /usr/share/bromigos/lab/provision-catalogue.toml, read through
# bromigos_homelab.provcatalog. The installer uses that one when it's there, and this file
# (the same schema) until it is.
#
#   [[group]]  id, name, icon (Adwaita symbolic), glyph (a key of lib/bromigos_textual.py's ICONS)
#   [[item]]   id, group (lab-core|ai|network|storage|games|home|brodec), name, line, hint, icon,
#              glyph, needs (ids it pulls in), conflicts, roles (roles that recommend it),
#              requires {cpu, ram_gb, disk_gb, gpu, gpu_vram_gb}, size_text, ports, internet,
#              modes (new|join|none: the lab choices it's offered with), install
#   [item.setup]  a guided setup: notes, links [{title, url}], check (the engine's live check:
#              bromigos lab provision --check ITEM), and [[item.setup.field]]s: id, label, kind
#              (text|secret|number|bool|choice|url|generated: made at the
#              first start, no person needed), default, hint, choices [{id, title, note,
#              link, fields}]. A secret field's value never goes in an answer file: the installer
#              keeps it root-only for the engine, which puts it in Podman secrets or the lab's Vault
#   [[model]]  id, name, line, gpu_vram_gb, size_text (for model serving, sized to the GPU)
schema = 1

[[group]]
id = "lab-core"
name = "Lab core"
icon = "network-workgroup-symbolic"
glyph = "lab"

[[group]]
id = "ai"
name = "AI"
icon = "applications-science-symbolic"
glyph = "chip"

[[group]]
id = "network"
name = "Network"
icon = "network-wired-symbolic"
glyph = "network"

[[group]]
id = "storage"
name = "Storage"
icon = "drive-multidisk-symbolic"
glyph = "disk"

[[group]]
id = "games"
name = "Games"
icon = "input-gaming-symbolic"
glyph = "gamepad"

[[group]]
id = "media"
name = "Media"
icon = "video-x-generic-symbolic"
glyph = "desktop"

[[group]]
id = "home"
name = "Home apps"
icon = "user-home-symbolic"
glyph = "house"

[[group]]
id = "brodec"
name = "BRODEC"
icon = "phone-symbolic"
glyph = "phone"

