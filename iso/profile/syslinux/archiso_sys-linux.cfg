# The channels (releng's two, renamed, and bromigOS's: the installer, safe graphics)
LABEL arch
MENU LABEL Start bromigOS (try it live)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% %KERNEL_PARAMS%

# the live desktop, straight into the installer (bromigos-iso-autostart opens it)
LABEL bromigos-install
MENU LABEL Install bromigOS
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% %KERNEL_PARAMS% bromigos.install

# the installer with no desktop (bromigos-iso-text-install@tty1, and the serial console's)
LABEL bromigos-install-text
MENU LABEL Install bromigOS (text mode)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% %KERNEL_PARAMS% bromigos.install=text systemd.unit=multi-user.target

LABEL nomodeset
MENU LABEL Start with safe graphics (nomodeset)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% %KERNEL_PARAMS% nomodeset
