# The medium's BIOS menu (syslinux's vesamenu), written by iso/grub-menus.py: the UEFI
# menu's entries in plain sentences, a help line for the highlighted one, the rest under
# More options. @DOT@ becomes CP437's middle dot.

LABEL arch
MENU LABEL Start bromigOS (try it first)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% %KERNEL_PARAMS%
TEXT HELP
The bromigOS desktop, running from the stick. Nothing on this computer changes.
ENDTEXT

LABEL bromigos-install
MENU LABEL Install bromigOS
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% %KERNEL_PARAMS% bromigos.install bromigos.edition=desktop
TEXT HELP
The desktop, with the installer open. It asks before it changes a disk.
ENDTEXT

LABEL bromigos-install-server
MENU LABEL Install bromigOS Server
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% bromigos.install bromigos.edition=server systemd.unit=multi-user.target
TEXT HELP
The text installer, for a server or lab machine with no desktop.
ENDTEXT

LABEL bromigos-fieldkit
MENU LABEL Field Kit (repair, lab and tools)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% bromigos.fieldkit systemd.unit=multi-user.target vt.default_red=0,255,57,212,90,201,63,180,78,255,156,240,140,227,138,230 vt.default_grn=5,118,255,175,169,123,224,200,107,157,255,211,202,168,245,245 vt.default_blu=0,111,20,55,230,219,197,180,78,151,138,106,245,239,226,230
TEXT HELP
bromigOS without the desktop: a menu for repairs, the lab and tools.
ENDTEXT

LABEL nomodeset
MENU LABEL Start with basic graphics (if the screen stays black)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% %KERNEL_PARAMS% nomodeset
TEXT HELP
The firmware's simple display instead of the graphics card's driver.
ENDTEXT

