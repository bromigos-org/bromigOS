# releng's tools and power, in plain words; "Boot from disk" chains the first hard disk
# (from a USB stick that's the stick itself: TAB, and hd1 instead of hd0)

# https://www.memtest.org/
LABEL memtest
MENU LABEL Memory test (Memtest86+)
LINUX /boot/memtest86+/memtest

LABEL existing
MENU LABEL Boot from disk
COM32 chain.c32
APPEND hd0 0

# Accessibility boot option
LABEL archspeech
MENU LABEL Start with the screen reader (^speech)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% accessibility=on %KERNEL_PARAMS%

# https://wiki.syslinux.org/wiki/index.php/Hdt_(Hardware_Detection_Tool)
LABEL hdt
MENU LABEL Hardware information (HDT)
COM32 hdt.c32
APPEND modules_alias=hdt/modalias.gz pciids=hdt/pciids.gz

LABEL reboot
MENU LABEL Restart
COM32 reboot.c32

LABEL poweroff
MENU LABEL Shut down
COM32 poweroff.c32
