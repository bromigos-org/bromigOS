# More options (iso/grub-menus.py)

MENU BEGIN more
MENU TITLE More options
MENU LABEL More options >
TEXT HELP
The system on this computer's disk, the screen reader, hardware information, power.
ENDTEXT

LABEL bromigos-install-text
MENU LABEL Install bromigOS with the text installer
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% bromigos.install=text bromigos.edition=desktop systemd.unit=multi-user.target
TEXT HELP
The desktop, installed from a text installer instead of the graphical one.
ENDTEXT

LABEL memtest
MENU LABEL Test this computer's memory
LINUX /boot/memtest86+/memtest
TEXT HELP
Memtest86+ checks the memory for faults. It runs until you restart.
ENDTEXT

LABEL existing
MENU LABEL Start the system on this computer's disk
COM32 chain.c32
APPEND hd0 0
TEXT HELP
The first hard disk's own boot menu. From a USB stick, that may be the stick:
press TAB and change hd0 to hd1.
ENDTEXT

LABEL archspeech
MENU LABEL Install with the screen reader (^speech)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% accessibility=on bromigos.install=text bromigos.voice=off systemd.unit=multi-user.target %KERNEL_PARAMS%
TEXT HELP
The installer, read aloud from the start.
ENDTEXT

LABEL hdt
MENU LABEL Hardware information (HDT)
COM32 hdt.c32
APPEND modules_alias=hdt/modalias.gz pciids=hdt/pciids.gz
TEXT HELP
What's in this computer, before anything starts.
ENDTEXT

LABEL reboot
MENU LABEL Restart
COM32 reboot.c32

LABEL poweroff
MENU LABEL Shut down
COM32 poweroff.c32

LABEL back
MENU LABEL < Back
MENU EXIT
MENU END
