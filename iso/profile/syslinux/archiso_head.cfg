# The bromigOS medium's boot menu on BIOS (syslinux's vesamenu; docs/boot.md): the UEFI
# menu's look in what vesamenu can do. splash.png and bromigos.psf (Geist Mono, 8x16, code
# page 437) are made by iso/syslinux-theme.py at build (the font goes in the profile's grub/,
# which mkarchiso copies whole, unlike syslinux/): the Wick's den at night, the title,
# the burn-in where the splash puts it, the signal meter on its progress line (row 34). The
# channel list sits under it, the countdown on row 36, the keys on the last. @DOT@ becomes
# CP437's middle dot.
SERIAL 0 115200
UI vesamenu.c32
MENU TITLE
MENU RESOLUTION 1024 768
MENU BACKGROUND splash.png
FONT /boot/grub/bromigos.psf

# 128 x 48 cells: the menu 60 wide, centred; the rows below count from VSHIFT (not
# HELPMSGENDROW): the countdown on row 36, the list from 38 (7 rows), the highlighted
# entry's help (TEXT HELP, iso/grub-menus.py) on 45-46, the keys on 48 (one-based)
MENU WIDTH 60
MENU MARGIN 0
MENU HSHIFT 34
MENU ROWS 7
MENU VSHIFT 34
MENU TIMEOUTROW 2
MENU TABMSGROW 13
MENU CMDLINEROW 13
MENU HELPMSGROW 11
MENU HELPMSGENDROW 46
MENU AUTOBOOT TUNING IN @DOT@ #
MENU TABMSG UP/DOWN choose @DOT@ ENTER boot @DOT@ TAB edit

# Refer to https://wiki.syslinux.org/wiki/index.php/Comboot/menu.c32
# the Wick's colours (#AARRGGBB): text on the den, the selected channel a phosphor bar
MENU COLOR screen       37;40   #00000000 #00000000 none
MENU COLOR border       30;44   #00000000 #00000000 none
MENU COLOR title        1;36;44 #00000000 #00000000 none
MENU COLOR unsel        37;44   #ffc4f5bb #00000000 none
MENU COLOR hotkey       1;37;44 #ff39ff14 #00000000 none
MENU COLOR sel          7;37;40 #ff000500 #f039ff14 none
MENU COLOR hotsel       1;7;37;40 #ff000500 #f039ff14 none
MENU COLOR disabled     1;30;44 #ff4e6b4e #00000000 none
MENU COLOR scrollbar    30;44   #ff159b09 #00000000 none
MENU COLOR tabmsg       31;40   #ff7e927e #00000000 none
MENU COLOR cmdmark      1;36;40 #ff39ff14 #00000000 none
MENU COLOR cmdline      37;40   #ffc4f5bb #00000000 none
MENU COLOR timeout_msg  37;40   #ff9cff8a #00000000 none
MENU COLOR timeout      1;37;40 #ff9cff8a #00000000 none
MENU COLOR help         37;40   #ff7e927e #00000000 none
MENU COLOR msg07        37;40   #ffc4f5bb #00000000 none

MENU CLEAR
MENU IMMEDIATE
