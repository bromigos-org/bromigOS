# The medium installs with no network (docs/iso.md). archiso's pacman-init, which fills
# pacman's keyring, runs after time-sync.target, and this service holds that target until
# a time server answers: with none, forever, and archinstall then finds no keys. So it
# waits 30 seconds at most, and its timing out isn't a failure; the clock is then the
# machine's own, and systemd-timesyncd still sets it when a network comes.
[Service]
ExecStart=
ExecStart=-/usr/bin/timeout 30 /usr/lib/systemd/systemd-time-wait-sync
