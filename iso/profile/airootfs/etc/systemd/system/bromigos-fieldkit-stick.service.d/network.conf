# The stick service on a medium (docs/fieldkit.md, "Your settings on the stick"): it hands the
# stick's Wi-Fi networks to NetworkManager, so NetworkManager starts first. Both media have
# this file and the multi-user.target.wants/ link beside it (Field Kit's build copies them);
# an install takes both away with the rest of the medium's own files. The packaged unit wants
# no network manager, so an installed system that runs iwd or systemd-networkd never gets
# NetworkManager from it. On the full medium this starts NetworkManager at every start, as
# before: the live desktop's network settings and the installer's Wi-Fi are NetworkManager's.
[Unit]
Wants=NetworkManager.service
After=NetworkManager.service
