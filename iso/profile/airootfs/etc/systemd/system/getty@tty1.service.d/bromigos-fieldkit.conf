# The full medium's Field Kit entry (bromigos.fieldkit on the kernel's command line;
# docs/fieldkit.md): root signed in on the first console, straight into the Field Kit menu.
# Any other start: the usual login prompt (the live desktop's SDDM has its own screen).
[Service]
ExecStart=
ExecStart=-/usr/lib/bromigos/fieldkit/fieldkit-getty ${TERM}
