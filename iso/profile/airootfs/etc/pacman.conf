#
# /etc/pacman.conf on the live medium (iso/profile/airootfs/etc/pacman.conf).
#
# Every package the live system and an install need is on the medium, in the offline
# repository under /var/lib/bromigos/repo: Arch's core and extra (the closure of what's
# installed here and of `bromigos`) and bromigOS's own. So the medium installs with no
# network. Arch's mirrors come after it, for anything else once the network is up
# (`choose-mirror`, or the mirrorlist as pacman-mirrorlist ships it).
#
# An install copies this live system onto the disk; the repository adds what it doesn't have
# (docs/iso.md, "How installing works"), so its package files are the ones this system lacks,
# and its databases list everything.
#
# NoExtract: what neither the medium nor an installed system has (docs/iso.md, "What the
# systems leave out"): other packages' docs (bromigOS's own and the manual stay), GTK's API
# docs and Hyprland's default wallpapers (bromigOS turns them off). The build leaves them out
# of the image with these same lines (iso/build-in-container.sh reads them here), and an
# install keeps them in its pacman.conf, so `pacman -Qk` finds every file it expects.
#

[options]
HoldPkg     = pacman glibc
Architecture = auto
ParallelDownloads = 5
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional
NoExtract   = usr/share/doc/* !usr/share/doc/bromigos*
NoExtract   = usr/share/gtk-doc/*
NoExtract   = usr/share/hypr/wall*.png

[core]
Server = file:///var/lib/bromigos/repo/$repo/os/$arch
Include = /etc/pacman.d/mirrorlist

[extra]
Server = file:///var/lib/bromigos/repo/$repo/os/$arch
Include = /etc/pacman.d/mirrorlist

[bromigos]
Server = file:///var/lib/bromigos/repo/$repo/$arch
