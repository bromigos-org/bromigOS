# https://www.supergrubdisk.org/wiki/Loopback.cfg
# The medium booted as an ISO file from another GRUB's menu: releng's, with bromigOS's
# channels in plain words (that GRUB's own theme draws them).

# Search for the ISO volume
search --no-floppy --set=archiso_img_dev --file "${iso_path}"
probe --set archiso_img_dev_uuid --fs-uuid "${archiso_img_dev}"

# Get a human readable platform identifier
if [ "${grub_platform}" == 'efi' ]; then
    archiso_platform='UEFI'
elif [ "${grub_platform}" == 'pc' ]; then
    archiso_platform='BIOS'
else
    archiso_platform="${grub_cpu}-${grub_platform}"
fi

# Get the lowercase UEFI machine type short-name to use for architecture-specific tools
if [ "${grub_platform}" == 'efi' ]; then
    if [ "${grub_cpu}" == 'x86_64' ]; then
        uefi_machine_type_lower='x64'
    elif [ "${grub_cpu}" == 'i386' ]; then
        uefi_machine_type_lower='ia32'
    elif [ "${grub_cpu}" == 'arm64' ]; then
        uefi_machine_type_lower='aa64'
    elif [ "${grub_cpu}" == 'riscv64' ]; then
        uefi_machine_type_lower='riscv64'
    elif [ "${grub_cpu}" == 'loongarch64' ]; then
        uefi_machine_type_lower='loongarch64'
    fi
fi

# Set default menu entry
default=bromigos
timeout=10
timeout_style=menu


# Menu entries

menuentry "Start bromigOS (try it live)" --class live --class os --id 'bromigos' {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% img_dev=UUID=${archiso_img_dev_uuid} img_loop="${iso_path}" %KERNEL_PARAMS%
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}

menuentry "Install bromigOS" --class install --id 'bromigos-install' {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% img_dev=UUID=${archiso_img_dev_uuid} img_loop="${iso_path}" %KERNEL_PARAMS% bromigos.install
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}

menuentry "Start with safe graphics (nomodeset)" --class safe --id 'bromigos-nomodeset' {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% img_dev=UUID=${archiso_img_dev_uuid} img_loop="${iso_path}" %KERNEL_PARAMS% nomodeset
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}

# Memtest86+ on UEFI: releng's path, or memtest86+-efi 8's own name, which mkarchiso 91 doesn't
# copy (iso/build-in-container.sh puts it beside this file)
if [ "${grub_platform}" == 'efi' -a "${grub_cpu}" == 'x86_64' ]; then
    if [ -f '/boot/memtest86+/memtest.efi' ]; then
        memtest_efi='/boot/memtest86+/memtest.efi'
    elif [ -f '/boot/grub/memtest86x64.efi' ]; then
        memtest_efi='/boot/grub/memtest86x64.efi'
    fi
    if [ -n "${memtest_efi}" ]; then
        menuentry 'Memory test (Memtest86+)' --class memtest --id 'memtest' {
            set gfxpayload=800x600,1024x768
            linux "${memtest_efi}"
        }
    fi
fi
if [ "${grub_platform}" == 'pc' -a -f '/boot/memtest86+/memtest' ]; then
    menuentry 'Memory test (Memtest86+)' --class memtest --id 'memtest' {
        set gfxpayload=800x600,1024x768
        linux /boot/memtest86+/memtest
    }
fi

menuentry "Start with the screen reader (speech)" --hotkey s --class speech --id 'archlinux-accessibility' {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% img_dev=UUID=${archiso_img_dev_uuid} img_loop="${iso_path}" accessibility=on %KERNEL_PARAMS%
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}

if [ "${grub_platform}" == 'efi' ]; then
    if [ -f "/shell${uefi_machine_type_lower}.efi" ]; then
        menuentry 'UEFI shell' --class shell --id 'uefi-shell' {
            chainloader /shell${uefi_machine_type_lower}.efi
        }
    fi

    menuentry 'UEFI firmware settings' --class efi --id 'uefi-firmware' {
        fwsetup
    }
fi

menuentry 'Shut down' --class shutdown --class poweroff --id 'shutdown' {
    echo 'Shutting down...'
    halt
}

menuentry 'Restart' --class restart --class reboot --id 'restart' {
    echo 'Restarting...'
    reboot
}
