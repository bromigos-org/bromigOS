# https://www.supergrubdisk.org/wiki/Loopback.cfg
# The medium booted as an ISO file from another GRUB's menu: releng's, with bromigOS's
# channels in plain words (that GRUB's own theme draws them).

# Search for the ISO volume
search --no-floppy --set=archiso_img_dev --file "${iso_path}"
probe --set archiso_img_dev_uuid --fs-uuid "${archiso_img_dev}"

# Get a human readable platform identifier
if [ "${grub_platform}" == 'efi' ]; then
    archiso_platform='UEFI'
elif [ "${grub_platform}" == 'pc' ]; then
    archiso_platform='BIOS'
else
    archiso_platform="${grub_cpu}-${grub_platform}"
fi

# Get the lowercase UEFI machine type short-name to use for architecture-specific tools
if [ "${grub_platform}" == 'efi' ]; then
    if [ "${grub_cpu}" == 'x86_64' ]; then
        uefi_machine_type_lower='x64'
    elif [ "${grub_cpu}" == 'i386' ]; then
        uefi_machine_type_lower='ia32'
    elif [ "${grub_cpu}" == 'arm64' ]; then
        uefi_machine_type_lower='aa64'
    elif [ "${grub_cpu}" == 'riscv64' ]; then
        uefi_machine_type_lower='riscv64'
    elif [ "${grub_cpu}" == 'loongarch64' ]; then
        uefi_machine_type_lower='loongarch64'
    fi
fi

# Set default menu entry
default=bromigos
timeout=10
timeout_style=menu


# The medium's ways to start, in plain sentences; H shows what each does

menuentry "Start bromigOS (try it first)" --class live --class os --id 'bromigos' {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% img_dev=UUID=${archiso_img_dev_uuid} img_loop="${iso_path}" %KERNEL_PARAMS%
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}

# the live desktop, straight into the installer (bromigos-iso-autostart opens it)
# Install bromigOS: the installer, desktop preselected; with /fieldkit/install-desktop.toml on the stick, unattended
if search --no-floppy --set=answers --file /fieldkit/install-desktop.toml; then
    menuentry "Install bromigOS (answers found on the stick: unattended)" --class install --id 'bromigos-install' {
        set gfxpayload=keep
        linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% img_dev=UUID=${archiso_img_dev_uuid} img_loop="${iso_path}" %KERNEL_PARAMS% bromigos.install bromigos.edition=desktop bromigos.answers=/fieldkit/install-desktop.toml
        initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
    }
    set default='bromigos-install'
    set timeout=15
else
    menuentry "Install bromigOS" --class install --id 'bromigos-install' {
        set gfxpayload=keep
        linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% img_dev=UUID=${archiso_img_dev_uuid} img_loop="${iso_path}" %KERNEL_PARAMS% bromigos.install bromigos.edition=desktop
        initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
    }
fi

# Install bromigOS Server: the installer, server preselected; with /fieldkit/install-server.toml on the stick, unattended
if search --no-floppy --set=answers --file /fieldkit/install-server.toml; then
    menuentry "Install bromigOS Server (answers found on the stick: unattended)" --class install --id 'bromigos-install-server' {
        set gfxpayload=keep
        linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% img_dev=UUID=${archiso_img_dev_uuid} img_loop="${iso_path}" bromigos.install bromigos.edition=server systemd.unit=multi-user.target bromigos.answers=/fieldkit/install-server.toml
        initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
    }
    set default='bromigos-install-server'
    set timeout=15
else
    menuentry "Install bromigOS Server" --class install --id 'bromigos-install-server' {
        set gfxpayload=keep
        linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% img_dev=UUID=${archiso_img_dev_uuid} img_loop="${iso_path}" bromigos.install bromigos.edition=server systemd.unit=multi-user.target
        initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
    }
fi

# Field Kit: the same medium without the desktop, for repairs, the lab and tools
# (docs/fieldkit.md): its menu on the first console, no splash
menuentry "Field Kit (repair, lab and tools)" --class fieldkit --id 'bromigos-fieldkit' {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% img_dev=UUID=${archiso_img_dev_uuid} img_loop="${iso_path}" bromigos.fieldkit systemd.unit=multi-user.target vt.default_red=0,255,57,212,90,201,63,180,78,255,156,240,140,227,138,230 vt.default_grn=5,118,255,175,169,123,224,200,107,157,255,211,202,168,245,245 vt.default_blu=0,111,20,55,230,219,197,180,78,151,138,106,245,239,226,230
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}

menuentry "Start with basic graphics (if the screen stays black)" --class safe --id 'bromigos-nomodeset' {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% img_dev=UUID=${archiso_img_dev_uuid} img_loop="${iso_path}" %KERNEL_PARAMS% nomodeset
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}

# the rest, one level down
submenu 'More options ›' --class options --id 'more' {
    menuentry "Install bromigOS with the text installer" --class install --id 'bromigos-install-text' {
        set gfxpayload=keep
        linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% img_dev=UUID=${archiso_img_dev_uuid} img_loop="${iso_path}" bromigos.install=text bromigos.edition=desktop systemd.unit=multi-user.target
        initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
    }

    # Memtest86+ on UEFI: releng's path, or memtest86+-efi 8's own name, which mkarchiso 91 doesn't
    # copy (iso/build-in-container.sh puts it beside this file)
    if [ "${grub_platform}" == 'efi' -a "${grub_cpu}" == 'x86_64' ]; then
        if [ -f '/boot/memtest86+/memtest.efi' ]; then
            memtest_efi='/boot/memtest86+/memtest.efi'
        elif [ -f '/boot/grub/memtest86x64.efi' ]; then
            memtest_efi='/boot/grub/memtest86x64.efi'
        fi
        if [ -n "${memtest_efi}" ]; then
            menuentry "Test this computer's memory" --class memtest --id 'memtest' {
                set gfxpayload=800x600,1024x768
                linux "${memtest_efi}"
            }
        fi
    fi
    if [ "${grub_platform}" == 'pc' -a -f '/boot/memtest86+/memtest' ]; then
        menuentry "Test this computer's memory" --class memtest --id 'memtest' {
            set gfxpayload=800x600,1024x768
            linux /boot/memtest86+/memtest
        }
    fi


    menuentry "Install with the screen reader (speech)" --hotkey s --class speech --id 'archlinux-accessibility' {
        set gfxpayload=keep
        linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% img_dev=UUID=${archiso_img_dev_uuid} img_loop="${iso_path}" accessibility=on bromigos.install=text bromigos.voice=off systemd.unit=multi-user.target %KERNEL_PARAMS%
        initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
    }

    if [ "${grub_platform}" == 'efi' ]; then
        if [ -f "/shell${uefi_machine_type_lower}.efi" ]; then
            menuentry 'Open the UEFI shell' --class shell --id 'uefi-shell' {
                chainloader /shell${uefi_machine_type_lower}.efi
            }
        fi

        menuentry "Open this computer's firmware settings" --class efi --id 'uefi-firmware' {
            fwsetup
        }
    fi

    menuentry 'Shut down' --class shutdown --class poweroff --id 'shutdown' {
        echo 'Shutting down...'
        halt
    }

    menuentry 'Restart' --class restart --class reboot --id 'restart' {
        echo 'Restarting...'
        reboot
    }
}

# a page in plain words for every entry (H from the menu)
menuentry "Help: what do these do?" --hotkey h --class info --id 'help' {
    insmod read
    # an entry starts with only exported variables: the theme's text colours again
    if [ -f /boot/grub/themes/bromigos/colors.cfg ]; then source /boot/grub/themes/bromigos/colors.cfg; fi
    clear
    echo ""
    echo "Start bromigOS (try it first)"
    echo "  The bromigOS desktop, running from the stick. Nothing on this computer changes."
    echo "Install bromigOS"
    echo "  The desktop, with the installer open. It asks before it changes a disk."
    echo "Install bromigOS Server"
    echo "  The text installer, for a server or lab machine with no desktop."
    echo "Field Kit (repair, lab and tools)"
    echo "  Repair. Recon. Deploy. Fix any computer, run your lab, install a server."
    echo "Start with basic graphics (if the screen stays black)"
    echo "  The firmware's simple display instead of the graphics card's driver."
    echo "More options"
    echo "  Install the desktop with the text installer, test this computer's memory, the"
    echo "  system on this computer's disk, installing with the screen reader (speech: the"
    echo "  installer read aloud), the UEFI shell, the firmware settings, shut down, restart."
    echo ""
    echo "Press Enter to go back to the menu."
    read
}

