# bromigOS Server's own packages (docs/server.md): in the Field Kit medium's offline store,
# so Server installs with no network, but not running on the medium (live = false).
# Same format as packages.toml (its rule (c) and (d)); iso/fieldkit/manifest.py reads both.
#
#   edition = true   the base every Server gets (bromigos-server's depends)
#   store = true     a role's packages (server/roles/*.toml, offline = true): on the stick, so
#                    the installer's role cards install with no network; installed only when
#                    the role is chosen
# Docker (Game server with a lab's Pelican panel) and Cockpit need the network: left out below.

[[package]]
name = "bromigos-server"
section = "Server"
reason = "bromigOS Server itself: the meta-package, bromigos server (status, safe updates, the firewall)"
live = false
edition = true

