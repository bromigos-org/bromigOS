# Field Kit's packages: the one list (docs/fieldkit.md, "What's on it"). A package is here only
# when (a) a Field Kit menu item, (b) booting and hardware support on unknown machines,
# (c) bromigOS Server, the installed edition, or (d) a documented server or lab job needs it.
# Server: what bromigOS Server (the installed edition) adds; in the offline store, not running
# on the medium (live = false) unless the medium needs it too.
# iso/fieldkit/manifest.py makes packages.x86_64 (the medium), the edition's list
# (fieldkit/edition.json) and docs/fieldkit-packages.md (with sizes) from it.
#
#   live     on the running medium            (default true)
#   edition  installed by bromigOS Server, the edition (default false)
#   store    in the offline store only, for the installer's hardware plan (default false)
#   if_available  only when a repository has it: a build before its first publish leaves it out
# Every live, edition and store package, with all its dependencies, is in the medium's
# offline store, so installing needs no network.

