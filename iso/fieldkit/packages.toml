# Left out on purpose (docs/fieldkit-packages.md lists them with these reasons)

[[left_out]]
names = "linux-firmware (the whole set)"
reason = "its split parts above cover common Wi-Fi, Ethernet, Bluetooth and graphics; the rest is below"

[[left_out]]
names = "nvidia-open nvidia-utils (in the offline store)"
reason = "NVIDIA's driver for a lab machine's compute: about 400 MiB with what it pulls in (Mesa, LLVM). bromigOS Server installs it once online (an open question: carry it?)"

[[left_out]]
names = "linux-firmware-nvidia"
reason = "only for nouveau on the live system, which Field Kit doesn't load (the basic display instead); in the offline store for lab GPU installs"

[[left_out]]
names = "linux-firmware-marvell"
reason = "Marvell Wi-Fi (Surface devices) and some server NICs: 79 MiB for rare hardware (an open question)"

[[left_out]]
names = "linux-firmware-cirrus linux-firmware-ti linux-firmware-amd"
reason = "laptop audio codecs, TI chips, AMD's security processor: not needed to boot, network or repair"

[[left_out]]
names = "archlinux releng: clonezilla partimage"
reason = "Field Kit's own imaging (partclone, in Clonezilla's format) replaces them"

[[left_out]]
names = "archlinux releng: cloud-init"
reason = "for cloud images; the test harness uses a test build's key instead"

[[left_out]]
names = "archlinux releng: hyperv open-vm-tools qemu-guest-agent virtualbox-guest-utils-nox"
reason = "guest tools for virtual machines; Field Kit is for real machines (an open question for VM servers)"

[[left_out]]
names = "archlinux releng: wireless_tools dhcpcd wvdial"
reason = "NetworkManager covers Wi-Fi, wired DHCP and modems; one network stack"

[[left_out]]
names = "archlinux releng: openvpn openconnect vpnc pptpclient xl2tpd systemd-resolvconf"
reason = "VPN clients: no menu item or lab job uses them yet"

[[left_out]]
names = "archlinux releng: nbd open-iscsi mkinitcpio-nfs-utils"
reason = "network block devices and PXE boot hooks: Field Kit boots from a stick or /boot"

[[left_out]]
names = "archlinux releng: bcachefs-tools jfsutils nilfs-utils udftools fatresize gpart mtools"
reason = "file systems bromigOS doesn't use"

[[left_out]]
names = "archlinux releng: dmraid"
reason = "fake RAID (BIOS RAID): mdadm reads the formats that matter"

[[left_out]]
names = "archlinux releng: tpm2-tools tpm2-tss libfido2 pcsclite openpgp-card-tools sequoia-sq"
reason = "TPM, FIDO2 and smartcard unlocking and signing: bromigOS unlocks with a passphrase"

[[left_out]]
names = "archlinux releng: ldns ndisc6 darkhttpd lftp irssi mc pv screen vim"
reason = "duplicates of kept tools (nmap, curl, tmux, micro, neovim) or nothing on the menu"

[[left_out]]
names = "archlinux releng: refind syslinux-hdt b43-fwcutter linux-atm usbmuxd mmc-utils sdparm sg3_utils lsscsi"
reason = "other boot loaders, old Broadcom firmware cutting, ADSL, iPhone tethering, SCSI and MMC tools"

[[left_out]]
names = "archlinux releng: grml-zsh-config terminus-font"
