# Field Kit's startup files: releng's archiso hooks without the splash, the PXE hooks and kms
# (graphics load from the medium itself, after the console is up), and without the early
# microcode hook, which stops Ventoy's normal mode from starting the medium
# (docs/fieldkit.md, "Ventoy"). memdisk and archiso_loop_mnt: an ISO started from memory or
# from a file (another GRUB's loopback, Ventoy's GRUB2 mode, the installed system's /boot).
HOOKS=(base udev modconf memdisk archiso archiso_loop_mnt block filesystems keyboard)
COMPRESSION="zstd"
COMPRESSION_OPTIONS=(-19 -T0)
