# The medium's BIOS menu (syslinux's vesamenu), written by iso/grub-menus.py: the UEFI
# menu's entries in plain sentences, a help line for the highlighted one, the rest under
# More options. @DOT@ becomes CP437's middle dot.

LABEL fieldkit
MENU LABEL Start Field Kit
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% %KERNEL_PARAMS%
TEXT HELP
Repair. Recon. Deploy. Fix any computer, run your lab, install a server.
Nothing on this computer changes until you choose something that does.
ENDTEXT

LABEL install-server
MENU LABEL Install bromigOS Server
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% %KERNEL_PARAMS% bromigos.install bromigos.edition=server
TEXT HELP
The text installer, for a server or lab machine with no desktop.
Everything it needs is on this stick: no network.
ENDTEXT

LABEL fieldkit-ram
MENU LABEL Start Field Kit @DOT@ then unplug the stick
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% %KERNEL_PARAMS% copytoram=y
TEXT HELP
Reads all of Field Kit into memory first: a minute, and 4 GB of memory.
ENDTEXT

LABEL fieldkit-remote
MENU LABEL Start Field Kit @DOT@ remote help over SSH
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% %KERNEL_PARAMS% bromigos.remote=on
TEXT HELP
SSH on, so someone you trust can help. The screen shows the address
and a one-time password.
ENDTEXT

LABEL nomodeset
MENU LABEL Start with basic graphics (if the screen stays black)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% %KERNEL_PARAMS% nomodeset
TEXT HELP
The firmware's simple display instead of the graphics card's driver.
ENDTEXT

LABEL memtest
MENU LABEL Test this computer's memory
LINUX /boot/memtest86+/memtest
TEXT HELP
Memtest86+ checks the memory for faults. It runs until you restart.
ENDTEXT

