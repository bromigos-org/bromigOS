# The Field Kit medium's boot menu on UEFI (archiso's uefi.grub boot mode; docs/boot.md).
# The full medium's (iso/profile/grub/grub.cfg), with Field Kit's ways to start, and the boot
# theme's medium variant titled "BROMIGOS // FIELD KIT" (iso/build-in-container.sh). Releng's
# entries stay: speech, the memory test, the UEFI shell, the firmware settings, power.

# Load partition table and file system modules
insmod part_gpt
insmod part_msdos
insmod fat
insmod iso9660
insmod ntfs
insmod ntfscomp
insmod exfat
insmod udf

# The theme, on a graphical terminal; without its fonts, releng's plain console
if loadfont /boot/grub/themes/bromigos/geist-mono-regular-16.pf2 ; then
    for f in /boot/grub/themes/bromigos/*.pf2 ; do
        loadfont "$f"
    done
    insmod all_video
    insmod gfxterm
    insmod gfxmenu
    insmod png
    set gfxmode="auto"
    terminal_input console
    terminal_output gfxterm
    set theme=/boot/grub/themes/bromigos/theme.txt
    export theme
    # GRUB's editor (E) and console (C) in the theme's colours (DRIFTGLASS)
    source /boot/grub/themes/bromigos/colors.cfg
elif loadfont "${prefix}/fonts/unicode.pf2" ; then
    insmod all_video
    set gfxmode="auto"
    terminal_input console
    terminal_output console
fi

# Enable serial console
insmod serial
insmod usbserial_common
insmod usbserial_ftdi
insmod usbserial_pl2303
insmod usbserial_usbdebug
if serial --unit=0 --speed=115200; then
    terminal_input --append serial
    terminal_output --append serial
fi

# Get a human readable platform identifier
if [ "${grub_platform}" == 'efi' ]; then
    archiso_platform='UEFI'
elif [ "${grub_platform}" == 'pc' ]; then
    archiso_platform='BIOS'
else
    archiso_platform="${grub_cpu}-${grub_platform}"
fi

# Get the lowercase UEFI machine type short-name to use for architecture-specific tools
if [ "${grub_platform}" == 'efi' ]; then
    if [ "${grub_cpu}" == 'x86_64' ]; then
        uefi_machine_type_lower='x64'
    elif [ "${grub_cpu}" == 'i386' ]; then
        uefi_machine_type_lower='ia32'
    elif [ "${grub_cpu}" == 'arm64' ]; then
        uefi_machine_type_lower='aa64'
    elif [ "${grub_cpu}" == 'riscv64' ]; then
        uefi_machine_type_lower='riscv64'
    elif [ "${grub_cpu}" == 'loongarch64' ]; then
        uefi_machine_type_lower='loongarch64'
    fi
fi

# Set default menu entry
default=fieldkit
timeout=10
timeout_style=menu


# Field Kit's ways to start (docs/fieldkit.md), in plain sentences; H shows what each does

menuentry "Start Field Kit" --class fieldkit --id 'fieldkit' {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% %KERNEL_PARAMS%
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}

# Install bromigOS Server: the installer, server preselected; with /fieldkit/install-server.toml on the stick, unattended
if search --no-floppy --set=answers --file /fieldkit/install-server.toml; then
    menuentry "Install bromigOS Server (answers found on the stick: unattended)" --class install --id 'install-server' {
        set gfxpayload=keep
        linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% %KERNEL_PARAMS% bromigos.install bromigos.edition=server bromigos.answers=/fieldkit/install-server.toml
        initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
    }
    set default='install-server'
    set timeout=15
else
    menuentry "Install bromigOS Server" --class install --id 'install-server' {
        set gfxpayload=keep
        linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% %KERNEL_PARAMS% bromigos.install bromigos.edition=server
        initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
    }
fi

menuentry "Start Field Kit · then unplug the stick" --class fieldkit --id 'fieldkit-ram' {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% %KERNEL_PARAMS% copytoram=y
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}

menuentry "Start Field Kit · remote help over SSH" --class fieldkit --id 'fieldkit-remote' {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% %KERNEL_PARAMS% bromigos.remote=on
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}

menuentry "Start with basic graphics (if the screen stays black)" --class safe --id 'fieldkit-nomodeset' {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% %KERNEL_PARAMS% nomodeset
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}

# Memtest86+ on UEFI: releng's path, or memtest86+-efi 8's own name, which mkarchiso 91 doesn't
# copy (iso/build-in-container.sh puts it beside this file)
if [ "${grub_platform}" == 'efi' -a "${grub_cpu}" == 'x86_64' ]; then
    if [ -f '/boot/memtest86+/memtest.efi' ]; then
        memtest_efi='/boot/memtest86+/memtest.efi'
    elif [ -f '/boot/grub/memtest86x64.efi' ]; then
        memtest_efi='/boot/grub/memtest86x64.efi'
    fi
    if [ -n "${memtest_efi}" ]; then
        menuentry "Test this computer's memory" --class memtest --id 'memtest' {
            set gfxpayload=800x600,1024x768
            linux "${memtest_efi}"
        }
    fi
fi
if [ "${grub_platform}" == 'pc' -a -f '/boot/memtest86+/memtest' ]; then
    menuentry "Test this computer's memory" --class memtest --id 'memtest' {
        set gfxpayload=800x600,1024x768
        linux /boot/memtest86+/memtest
    }
fi

# the rest, one level down
submenu 'More options ›' --class options --id 'more' {
    # the installed system: its own GRUB menu (its grub.cfg on another disk than this medium,
    # read here: a GRUB chainloaded from this one loses its way to its prefix), else the first
    # other boot loader found there (systemd-boot's, limine's, Windows', the removable path),
    # else the firmware's next device. connectefi: a firmware that booted the medium "fast" may
    # not have connected the other disks
    if [ "${grub_platform}" == 'efi' ]; then
        menuentry "Start the system on this computer's disk" --class disk --id 'disk' {
            insmod regexp
            insmod connectefi
            connectefi all
            regexp --set=1:medium_disk '^([^,]*)' "${root}"
            for cfg in (*)/grub/grub.cfg (*)/boot/grub/grub.cfg ; do
                if [ -f "${cfg}" ] ; then
                    regexp --set=1:cfg_disk '^\(([^,)]*)' "${cfg}"
                    regexp --set=1:cfg_dev '^\(([^)]*)\)' "${cfg}"
                    if [ "${cfg_disk}" != "${medium_disk}" ] ; then
                        set root="${cfg_dev}"
                        configfile "${cfg}"
                    fi
                fi
            done
            for loader in (*)/EFI/systemd/systemd-bootx64.efi (*)/EFI/limine/BOOTX64.EFI (*)/EFI/Microsoft/Boot/bootmgfw.efi (*)/EFI/BOOT/BOOTX64.EFI ; do
                if [ -f "${loader}" ] ; then
                    regexp --set=1:loader_disk '^\(([^,)]*)' "${loader}"
                    if [ "${loader_disk}" != "${medium_disk}" ] ; then
                        chainloader "${loader}"
                        boot
                    fi
                fi
            done
            exit
        }
    fi

    menuentry "Start with the screen reader (speech)" --hotkey s --class speech --id 'archlinux-accessibility' {
        set gfxpayload=keep
        linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% accessibility=on %KERNEL_PARAMS%
        initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
    }

    if [ "${grub_platform}" == 'efi' ]; then
        if [ -f "/shell${uefi_machine_type_lower}.efi" ]; then
            menuentry 'Open the UEFI shell' --class shell --id 'uefi-shell' {
                chainloader /shell${uefi_machine_type_lower}.efi
            }
        fi

        menuentry "Open this computer's firmware settings" --class efi --id 'uefi-firmware' {
            fwsetup
        }
    fi

    menuentry 'Shut down' --class shutdown --class poweroff --id 'shutdown' {
        echo 'Shutting down...'
        halt
    }

    menuentry 'Restart' --class restart --class reboot --id 'restart' {
        echo 'Restarting...'
        reboot
    }
}

# a page in plain words for every entry (H from the menu)
menuentry "Help: what do these do?" --hotkey h --class info --id 'help' {
    insmod read
    # an entry starts with only exported variables: the theme's text colours again
    if [ -f /boot/grub/themes/bromigos/colors.cfg ]; then source /boot/grub/themes/bromigos/colors.cfg; fi
    clear
    echo ""
    echo "Start Field Kit"
    echo "  Repair. Recon. Deploy. Fix any computer, run your lab, install a server."
    echo "  Nothing on this computer changes until you choose something that changes it."
    echo "Install bromigOS Server"
    echo "  The text installer, for a server or lab machine with no desktop. Everything it"
    echo "  needs is on this stick: no network. It asks before it changes a disk."
    echo "Start Field Kit · then unplug the stick"
    echo "  Reads all of Field Kit into memory first: a minute, and 4 GB of memory."
    echo "Start Field Kit · remote help over SSH"
    echo "  SSH on, so someone you trust can help over the network. The screen shows the"
    echo "  address and a one-time password. It's off in every other entry."
    echo "Start with basic graphics (if the screen stays black)"
    echo "  The firmware's simple display instead of the graphics card's driver."
    echo "Test this computer's memory"
    echo "  Memtest86+ checks the memory for faults. It runs until you restart."
    echo "More options"
    echo "  The system on this computer's disk, the screen reader (speech), the UEFI shell,"
    echo "  the firmware settings, shut down, restart."
    echo ""
    echo "Press Enter to go back to the menu."
    read
}


# GRUB init tune for accessibility
play 600 988 1 1319 4
