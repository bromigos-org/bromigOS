# The Wick's den and the desktop's widgets (docs/widgets.md, "Layouts"; the format is in
# widgets/layouts.py). The colour themes draw this same den, recoloured, so they use this
# file too, and share the layout the desktop remembers for it. A colour theme gets its own
# by having a widgets/layout.toml of its own.
#
# [[clear]]: the scene's focal points, as fractions of the 2560x1440 picture (x, y, width,
# height). Layouts, Tidy up and adding a widget keep off them. soft = true: kept clear while
# there's room elsewhere. The den's screens are the live layer's DEN rects
# (live/live/scene.py: "big", "wave", "emblem", the meters and the schematic around them).

scene_title = "the Wick"

[[clear]]
name = "the den's screens and TVs"
rect = [0.385, 0.375, 0.31, 0.51]

[[clear]]
name = "the window and the station"
rect = [0.44, 0.0, 0.515, 0.63]

[[clear]]
name = "the desk"
rect = [0.385, 0.85, 0.44, 0.15]
soft = true

# The layout made for the den: the panels in the dark of the left wall, as bromigOS's own
# layout has them, and what's playing on the chair.
title = "Made for the Wick"
description = "The den as it was meant: the panels on the dark wall, the screens and the window clear"
archetype = "theme"

[[widget]]
name = "system"
size = "standard"
small = "compact"
big = "large"
side = "left"
priority = 1

[[widget]]
name = "network"
size = "standard"
small = "compact"
side = "left"
priority = 2

[[widget]]
name = "storage"
size = "standard"
small = "compact"
side = "left"
priority = 3

[[widget]]
name = "workbench"
size = "standard"
small = "compact"
side = "left"
lane = 2
priority = 2

[[widget]]
name = "notes"
side = "left"
lane = 2
priority = 3

[[widget]]
name = "nowplaying"
size = "standard"
small = "compact"
side = "right"
from = "bottom"
priority = 4
