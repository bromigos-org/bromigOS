# Mire's colours (docs/theming.md, "colors.toml"): black water, moss, firefly light,
# the porch lantern's amber.

# ---- surfaces, darkest first
background = "#05090a"     # the black water
void = "background"
panel = "#0c1513"          # bars, launcher, notifications
selection = "#1c2d27"      # the selected row, inactive borders

# ---- ink
primary = "#b8e05a"        # live values, active borders: firefly light
soft = "#d6e8b4"           # body text on panels
dim = "#5d7a4b"            # rules, frames, quiet labels: moss
text = "#cfdcc4"           # terminal and long-form text
muted = "#7a8a78"          # inactive labels
faint = "#4a5a4c"          # disabled text

# ---- signals
warn = "#e8a040"           # the porch lantern
danger = "#e0604f"
warn_surface = "#3e2c0e"
danger_surface = "#1c0806"
danger_text = "#ffd9d2"

[colors]
cyan = "#58e0e8"           # the sleepers' eye-lamps
gold = "#f0d070"
white = "#eef4e0"
rust = "#4a160e"

[holo]
line = "primary"
glow = "primary"
label = "text"
highlight = "white"

[widgets]
frame = "dim"
header = "primary"
value = "soft"
graph = "primary"
track = "selection"

[terminal]
foreground = "text"
background = "background"
color0 = "background"
color1 = "danger"
color2 = "primary"
color3 = "warn"
color4 = "#5a9ab8"
color5 = "#b07ab8"
color6 = "cyan"
color7 = "#b4c4b0"
color8 = "faint"
color9 = "#f08a7c"
color10 = "soft"
color11 = "gold"
color12 = "#8cc0dc"
color13 = "#d8a8e0"
color14 = "#9cf0f0"
color15 = "#e8f0e0"

[qt]
view = "#070c0c"
view_alt = "#0a1110"
header = "#08100f"
window_alt = "#0f1a18"
button = "#16241f"
neutral_on_selection = "#4a3a10"
negative_on_selection = "rust"

[intercept]                  # the unlock/login intercept (the live layer)
static = "primary"           # the colour the static grades the captured screen to
needle = "gold"          # the needle that sweeps the emblem's dial as it draws
