[[assets]]
id = "comp-v3-flare"
kind = "image"
model = "gpt-image-2.5-flare"
inputs = ["art/refs/den-empty.jpg"]
aspect = "16:9"
render_quality = "high"
out = "art/comps/mire-comp-v3-flare-a.png"
prompt = '''
The attached reference image is ONLY a style reference: match its rendering quality, painterly-cinematic brushwork, gritty detail, lighting craft and subtle film grain. Do not copy its content, its composition or its exact colour grade. Paint this new scene:
Night bayou swamp, wide 16:9. Layout: huge twisted cypress trees with long hanging moss frame the left and right edges of the frame. Center-right, the focal point: a weathered wooden stilt shack standing over black mirror-still water, rusted corrugated tin roof, a front porch with a hanging oil lantern glowing warm amber, crates, nets, buckets and junk piled on the porch, and a tall improvised radio mast of welded pipe with a yagi antenna rising from the roof, with a small round blank dark metal plate bolted to the mast. On the porch, the old keeper sits in a wooden rocking chair near the porch edge, fishing with a long bamboo rod angled out over the water, seen from behind as a dark silhouette in a wide-brimmed hat against the lantern glow, no face visible. A flat-bottomed wooden skiff is tied to the stilts below the porch. Left-center, in the mid-background, half-sunk and tilted in the swamp: the colossal moss-covered head of a long-dead war machine of original design, an angular riveted armored helmet-like head with a narrow horizontal visor slit glowing faint green and one dark round optic lens, cracked plating, vines and moss, no mouth, no teeth. Lily pads, low mist drifting on the water, a few tiny green firefly points of light, clear dark reflections of the shack and the head in the still water. Humid, eerie, lived-in mood. Palette: green-black night close to phosphor greens, the warm amber lantern as the one warm light. Gritty realistic painterly cinematic sci-fi concept art, matte painting, not cartoon, not anime, highly detailed weathered textures, low-key lighting, deep near-black shadows. No text, no letters, no logos, no watermark.'''

[[assets]]
id = "comp-v4-flare"
kind = "edit"
model = "gpt-image-2.5-flare"
input = "@comp-v3-flare"
mask = "art/masks/mire-edit-mask.png"
aspect = "16:9"
render_quality = "high"
out = "art/comps/mire-comp-v4-flare-a.png"
prompt = '''
Edit this painting. Keep the entire image exactly as it is: the stilt shack, the old keeper in his rocking chair fishing, the lantern, the boat, the cypress trees and hanging moss, the mirror-still black water, the mist, the lily pads, the colours, the lighting and the painterly rendering. Change ONLY these things:
1. Replace the giant robot head on the left with the wreck of a crashed military gunship-dropship of wholly original design: a chunky, boxy, utilitarian armoured hull with heavy riveted plating, stubby angular wing stubs and a squat ventral engine pod, nose-down and half-sunk at a steep angle in the swamp, its flat armoured cockpit canopy cracked and fogged, heavily overgrown with moss, vines and long hanging moss, rust streaks and scorched paint, and a faint sickly green glow deep inside one exposed engine housing. It is not a robot, not a creature and has no face; it does not resemble any known film or game spaceship.
2. Scatter old battlefield wreckage in the water around the left and middle of the swamp, half-swallowed by lily pads and mist: a torn-off engine nacelle lying on its side, a single wing fin jutting up out of the water, bent hull plates, a rusted gun turret, and the faint silhouette of a second, smaller wreck far back in the mist.
Reflect the new wreckage in the still water. Same night palette of green-black with the warm amber lantern as the only warm light. No text, no letters, no logos, no insignia.'''

