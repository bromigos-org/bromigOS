# Mire's art: every asset, how it is made, and (in art.log.jsonl) the job
# that made it. `bromigos art status|plan|run` (docs/art.md). Outputs under art/
# are working sources, kept out of git and out of the package.
format = 1

[defaults]
aura = false

[[assets]]
id = "comp-seedream"
kind = "image"
model = "seedream-4.5"
aspect = "16:9"
quality = "2k"
out = "art/comps/mire-comp-seedream.jpg"
prompt = '''
Night bayou swamp. Focal point, center-right: a weathered wooden stilt shack standing over black mirror-still water, rusted corrugated tin roof, a front porch with a hanging oil lantern glowing warm amber, an old rocking chair, clutter of crates, nets, buckets and junk, and a tall improvised radio mast of welded pipe and antenna wires rising from the roof with a small round blank metal plate bolted to it. The keeper, an old fisherman in a wide-brimmed hat, sits on the porch edge holding a long fishing rod, seen from behind as a dark silhouette against the lantern glow, no face visible. A flat-bottomed wooden skiff is tied to the stilts. Huge twisted cypress trees with long hanging moss frame the scene, lily pads, low mist drifting on the water, scattered green fireflies. In the left background, half-sunk in the swamp, the colossal moss-covered head of a long-dead war machine of original design: a blocky riveted armored dome with heavy jaw plates and a single dark round optic, cracked plating, vines and moss, tilted and partly submerged. Clear reflections in the still black water. Humid, eerie, lived-in mood. Palette: green-black night, warm amber lantern light, faint phosphor-green glow of fireflies and mist. Painterly cinematic sci-fi concept art, matte painting illustration, highly detailed, gritty weathered textures, low-key night lighting with deep near-black shadows, subtle film grain, wide 16:9 establishing shot. No text, no letters, no logos, no watermark, no signature.'''

