# ---- the post's emblem (Greywater Light's mark; docs/theming.md, "The emblem"). Concepts
# only: the shipped emblem/ kit is vector, built by bromigos-emblem from emblem/emblem.toml.
[[assets]]
id = "emblem-concept-a"
kind = "image"
model = "gpt-image-2.5-flare"
inputs = ["art/refs/wick-emblem.png", "art/refs/tidewell-comp.png"]
aspect = "1:1"
render_quality = "high"
out = "art/emblem/tidewell-emblem-concept-a.png"
prompt = '''
Image 1 is the network's emblem, "the burn-in": a thin double ring with a motto in wide-tracked uppercase monospace running clockwise in the band, an eleven-tick tuning-dial gap at twelve o'clock, and at the centre one solid black flame (one main tongue, two small side tongues, leaning slightly right) outlined by a thin hairline, with a relay mast cut through it in negative space. Image 2 is only a palette and mood reference for the world.
Design a sibling emblem in exactly the same flat vector graphic style, same ring geometry and proportions, for Tidewell, an ocean world whose post is a small lighthouse on a black rock, where the flame is painted on a bell buoy, and where vast glowing leviathans called the Choir sing in the deep. Ring lines and ring text in sea cyan #3fd8e8 on deep navy-black #02070d. The motto in the ring band reads exactly: THE DEEP SINGS FIRST · SOMEONE WRITES IT DOWN ·  The tuning gap at twelve o'clock is eleven thin vertical bars of varying heights like a sound-wave trace of a whale song, the centre bar tallest. Centre sigil: the black flame with its relay-mast cut-out, standing above a swell drawn as two smooth wave lines in deep teal #2a7488 crossing its base; under the swell, the long curved back of a leviathan drawn as an arc of small glowing cyan dots, like bioluminescence. Flat vector emblem, crisp clean shapes, no gradients except a faint glow, perfectly centred, symmetrical ring, plain dark background, no extra text.'''

