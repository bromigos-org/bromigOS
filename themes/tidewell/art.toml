# Tidewell's art: every asset, how it is made, and (in art.log.jsonl) the job
# that made it. `bromigos art status|plan|run` (docs/art.md). Outputs under art/
# are working sources, kept out of git and out of the package.
format = 1

[defaults]
aura = false

[[assets]]
id = "comp-seedream"
kind = "image"
model = "seedream-4.5"
aspect = "16:9"
quality = "2k"
out = "art/comps/tidewell-comp-seedream.jpg"
prompt = '''
Split-level view of the ocean at night, half above and half below the waterline, which runs horizontally across the middle of the frame. Above the water, the focal point filling the center: Greywater Light, a storm-weathered old lighthouse built on top of a rusted offshore sea platform, seen up close: a glowing lamp room with a gallery rail around it, a lit window in the tower, a small keeper's cottage with a warm lit window on the platform deck, steel stairs and railings, hanging buoy lamps, rusted steel legs plunging into the sea, a small round blank metal plate on the lamp housing. A tiny silhouetted figure of the keeper stands at the gallery rail, no face visible. Around it the open dark sea with heavy swells, a distant horizon and a brooding cloudy night sky with faint moonlight breaking through. Below the waterline: the rusted platform legs, crusted with barnacles and kelp, descend into murky dark blue-green water that falls away into a black abyss, lit only by faint scattered bioluminescent specks. Cold, lonely, vast mood. Palette: blue-black, cold sea green, warm amber window and lamp light, faint cyan-green bioluminescence. Painterly cinematic sci-fi concept art, matte painting illustration, highly detailed, gritty weathered textures, low-key night lighting with deep near-black shadows, subtle film grain, wide 16:9 establishing shot. No text, no letters, no logos, no watermark, no signature.'''

[[assets]]
id = "comp-v2-seedream"
kind = "image"
model = "seedream-4.5"
aspect = "16:9"
quality = "2k"
out = "art/comps/tidewell-comp-v2-seedream.jpg"
prompt = '''
Split-level half-underwater view at night, the waterline running horizontally across the frame just below the middle. Above the water, the focal point filling the center of the frame: Greywater Light, a tall storm-weathered old lighthouse tower standing on a rusted offshore sea platform, seen up close so it reads as a home: the glowing lamp room at the top with a gallery rail around it, a lit window halfway up the tower, a small keeper's cottage with a warm lit window and a chimney on the platform deck, steel stairs, railings, ropes, crates and hanging buoy lamps, a small round blank metal plate on the lamp housing. A tiny silhouetted figure of the keeper stands at the gallery rail, no face visible. Behind it the open dark sea with heavy swells, a distant horizon and a brooding cloudy night sky with faint moonlight breaking through. Below the waterline, the same four rusted platform legs continue straight down, crusted with barnacles and kelp, into murky dark water that fades quickly into a pitch-black abyss, lit only by faint scattered bioluminescent specks. The underwater half is mostly very dark. Cold, lonely, vast mood. Palette: blue-black, cold sea green, warm amber window and lamp light, faint cyan bioluminescence. Gritty realistic painterly cinematic sci-fi concept art, matte painting, highly detailed weathered textures, low-key lighting, subtle film grain, wide 16:9. No text, no letters, no logos, no watermark.'''

[[assets]]
id = "comp-v3-flare"
kind = "image"
model = "gpt-image-2.5-flare"
inputs = ["art/refs/den-empty.jpg"]
aspect = "16:9"
render_quality = "high"
out = "art/comps/tidewell-comp-v3-flare-a.png"
prompt = '''
The attached reference image is ONLY a style reference: match its rendering quality, painterly-cinematic brushwork, gritty detail, lighting craft and subtle film grain. Do not copy its content, its composition or its green colour grade. Paint this new scene:
Night ocean seen in a split half-underwater cross-section view, the waterline running perfectly horizontally across the frame very high up, at about one fifth of the image height from the top. Above the waterline, only a thin strip: a dark cloudy night sky with a pale moon glow, the dark sea surface and a distant horizon. In the upper right corner, small in the frame: a lonely old lighthouse standing on a narrow jagged sliver of black rock, the only land in sight, its lamp room glowing warm amber and one tiny lit cottage window at its foot, a tiny dark silhouette in the lamp room. Below the waterline, filling most of the image, the underwater world is the focus: the rock sliver's base descending steeply as an underwater cliff on the right; rocky shelves and tall swaying kelp forests in the mid-ground; schools of small silver fish catching faint moonlight; a few translucent jellyfish; the dark hull of a small fishing trawler breaking the surface on the left, seen from below, with its net hanging down into the water; pale shafts of moonlight filtering down from the surface. Toward the bottom the water falls away into a deep, dark, open abyss, lit only by faint scattered cyan bioluminescent specks, with empty open space in the deep. Cold, lonely, vast, quiet mood. Palette: blue-black, slate, cold sea green, warm amber lamp light as the only warm colour, faint cyan bioluminescence. Gritty realistic painterly cinematic sci-fi concept art, matte painting, not cartoon, not anime, highly detailed weathered textures, low-key lighting, deep near-black shadows, subtle film grain, wide 16:9. No text, no letters, no logos, no watermark.'''

