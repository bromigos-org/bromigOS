Design a sibling emblem in exactly the same flat vector graphic style, same ring geometry and proportions, for Tidewell's post: a bell buoy riding the swell off a black rock, with the black flame painted on it. Ring lines and ring text in sea cyan #3fd8e8 on deep navy-black #02070d. The motto in the ring band reads exactly: THE DEEP SINGS FIRST · SOMEONE WRITES IT DOWN ·  The tuning gap at twelve o'clock is eleven thin vertical bars of varying heights like a sound-wave trace, the centre bar tallest. Centre sigil: a bell buoy in silhouette, an open lattice tower with a small bell hanging inside and a warm white lamp #f0b850 on top, standing on a round float riding two smooth wave lines in deep teal #2a7488; the float carries the black flame with the relay-mast cut-out painted large on it, outlined by a thin cyan hairline. Flat vector emblem, crisp clean shapes, no gradients except a faint glow, perfectly centred, symmetrical ring, plain dark background, no extra text.'''

