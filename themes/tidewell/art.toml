# ---------------------------------------------------------------- craft overhead: the flybys
# (Pip Arro's Petrel and the Drift long-hauler come from Mire's sheet; these are Tidewell's own)
[[assets]]
id = "ships-sheet"
kind = "image"
model = "gpt-image-2.5-flare"
inputs = ["art/refs/tidewell-sky-crop.png", "art/refs/mire-ships-ref.png"]
aspect = "3:2"
render_quality = "high"
out = "art/actors/ships-sheet.png"
note = "Tidewell's craft overhead: a rig-hopper and a trawler's fish-spotter"
prompt = '''
Reference image 1 (a painted night sea with a lighthouse and a trawler) is ONLY a style, palette and lighting reference. Reference image 2 (a sheet of three craft on grey) is ONLY a rendering reference: match its painterly-cinematic rendering, gritty weathered detail and level of finish exactly, so the new craft belong in the same universe. Do not copy any of its craft.
Paint a sprite sheet of two different flying craft of wholly original design from an ocean colony of rusted sea platforms, each one complete, separate, not overlapping, with generous empty margin around it, both flying toward the RIGHT, seen in clean side profile from slightly below as if passing overhead, lit by cool moonlight from above with soft silver rim light on their top edges and their own small lights:
LEFT, larger: a rig-hopper, the heavy-lift cargo craft that runs supplies between sea platforms: a squat, boxy, salt-stained fuselage in faded rust-orange and white workboat paint with weathered stencil-free panels, a small lit cab window glowing warm, two big rotors on short tilted pylons above it drawn as faint translucent motion-blurred discs, landing skids, and a dented steel shipping container slung beneath it on four taut cables, a red beacon lamp on top and a downward work floodlight under the nose.
RIGHT, smaller: a trawler's fish-spotter, a light two-seat autogyro that trawler crews fly to find shoals: an open-frame tubular fuselage with a small glazed bubble cab, a single big two-blade overhead rotor drawn as a faint translucent motion-blurred disc, a pusher propeller at the back drawn as a faint blurred disc, a pair of inflatable float pontoons, a long whip aerial, a search lamp under the cab, faded sea-green and cream paint, rust and salt crust.
Isolated on a plain flat uniform mid-grey background, no sea, no sky, no clouds, no ground, no shadow. Gritty realistic painterly cinematic sci-fi concept art, not cartoon, not anime, not toy-like, highly detailed. Nothing resembling any known film or game vehicle. No text, no letters, no numbers, no logos, no insignia, no watermark.'''

[[assets]]
id = "ships-cut"
kind = "cutout"
model = "remove-background"
input = "@ships-sheet"
out = "art/actors/ships-cut.png"

