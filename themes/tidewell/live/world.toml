# ---------------------------------------------------------------- craft overhead: the network
# Now and then a craft crosses the strip of sky: rig-hoppers running supplies between the
# platforms, a trawler's fish-spotter out looking for shoals, Pip Arro's Petrel in on a
# parts run, a Drift long-hauler far up. Behind Greywater Light and the lit clouds, always
# above the trawlers' masts. The busier this machine's network, the sooner the next one.
# Off with `bromigos anim off ships`.
[[actors]]
id = "flybys"
kind = "flyby"
switch = "ships"
signal = "net"
every = [180, 480]
gain = 2.0
first = [40, 120]
