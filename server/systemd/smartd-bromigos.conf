# bromigOS Server (docs/server.md, "Disks"): smartd with bromigOS Server's watch list
# (/usr/share/bromigos/server/smartd.conf). Type=simple and -q nodev0: a machine with no disk
# smartd can read (a VM, a RAID card that hides them) leaves it stopped, not failed, so it
# never counts against an update's health check.
[Service]
Type=simple
ExecStart=
ExecStart=/usr/bin/smartd -n -q nodev0 -c /usr/share/bromigos/server/smartd.conf $SMARTD_ARGS
