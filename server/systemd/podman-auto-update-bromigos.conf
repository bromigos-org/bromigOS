# bromigOS Server (docs/server.md, "Services"): the containers update after the system's own
# nightly update (04:00 to 05:00), not at midnight. podman auto-update restarts each
# container whose image changed, and rolls one back when its unit fails to start.
[Timer]
OnCalendar=
OnCalendar=*-*-* 05:30:00
RandomizedDelaySec=15min
