# bromigOS Server (docs/server.md, "Containers and services"): the containers update after the system's own
# nightly update (04:00 to 05:00), not at midnight. podman auto-update restarts each
# container marked AutoUpdate=registry whose image changed, and rolls one back when its unit
# fails to start. The catalogue's container apps (bromigos lab provision --local) aren't
# marked: their images are pinned by digest, and they don't update by themselves.
[Timer]
OnCalendar=
OnCalendar=*-*-* 05:30:00
RandomizedDelaySec=15min
