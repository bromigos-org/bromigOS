# bromigOS Server (docs/server.md, "SSH"): sshguard with bromigOS Server's settings (nftables
# sets, sshd's journal), in place of /etc/sshguard.conf, which stays as the package left it.
[Unit]
After=bromigos-server-firewall.service

[Service]
BindReadOnlyPaths=/usr/share/bromigos/server/sshguard.conf:/etc/sshguard.conf
