# bromigOS Server (docs/server.md, "The firewall"): the lab's private network's addresses (the
# carrier-grade NAT range) count as the local network only while this server is on that network.
# So the firewall is loaded again when tailscaled has started and when it has stopped. A firewall
# that is off stays off: only a running bromigos-server-firewall.service reloads.
[Service]
ExecStartPost=-/usr/bin/systemctl reload --no-block bromigos-server-firewall.service
ExecStopPost=-/usr/bin/systemctl reload --no-block bromigos-server-firewall.service
