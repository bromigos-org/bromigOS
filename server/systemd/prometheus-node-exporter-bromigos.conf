# bromigOS Server (docs/server.md, "Monitoring"): the node exporter the lab's Prometheus reads,
# with the textfile folder the lab's own metrics (and bromigos-server's) are written to.
# The firewall lets only the local network reach port 9100.
[Service]
ExecStart=
ExecStart=/usr/bin/prometheus-node-exporter --collector.textfile.directory=/opt/bromigos-monitoring/textfile $NODE_EXPORTER_ARGS
ReadOnlyPaths=/opt/bromigos-monitoring
