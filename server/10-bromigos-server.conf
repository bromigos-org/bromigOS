# bromigOS Server (docs/server.md, "SSH"): signing in over SSH takes a key; root can't sign in.
# A password works too only when it was chosen at install: /etc/bromigos/server.toml's
# [ssh] password = true makes 05-bromigos-server-password.conf, which sshd reads first.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
