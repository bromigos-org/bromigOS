# bromigOS Server (docs/server.md, "SSH"): signing in over SSH takes a key; root can't sign in.
# A password works too only when it was chosen at install: /etc/bromigos/server.toml's
# [ssh] password = true makes 05-bromigos-server-password.conf, which sshd reads first.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
# Fewer guesses, a shorter window, and only the people meant to sign in: the wheel group
# (the account made at install) and bromigos-ssh (add others with
# sudo gpasswd -a NAME bromigos-ssh; the Lab node role's lab account is in it)
MaxAuthTries 3
LoginGraceTime 30
AllowGroups wheel bromigos-ssh
