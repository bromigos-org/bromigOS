# bromigOS Server's sshguard (docs/server.md, "SSH"): reads sshd's journal and blocks a
# guessing address for a while through nftables sets (its own tables, ip and ip6 sshguard,
# beside bromigos-server's). sshguard.service reads this file in place of /etc/sshguard.conf
# (the drop-in /usr/lib/systemd/system/sshguard.service.d/bromigos-server.conf binds it there).
LOGREADER="LANG=C /usr/bin/journalctl -afb -p info -n1 -t sshd -t sshd-session -o cat"
BACKEND="/usr/lib/sshguard/sshg-fw-nft-sets"
# blocked for 2 minutes at first, longer each time; after 120 points, kept in the list
BLACKLIST_FILE=120:/var/db/sshguard/blacklist.db
THRESHOLD=30
BLOCK_TIME=120
DETECTION_TIME=1800
# never this machine itself
WHITELIST_ARG="127.0.0.0/8 ::1"
