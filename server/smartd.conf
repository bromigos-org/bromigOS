# bromigOS Server's disk watch (docs/server.md, "Disks"): every disk smartd finds, its health
# and error logs, a short self-test each night at 02:00 and a long one on Saturdays at 01:00,
# and its temperature (a note at 55 °C, a warning at 65 °C, and every change of 4 °C).
# A warning goes to the journal and to bromigos-server-disk-alert, which keeps it for
# `bromigos server` (/var/lib/bromigos/server/disk-alerts.jsonl). No mail is sent.
# smartd.service reads this file (its drop-in: -c); /etc/smartd.conf is left as it is.
DEVICESCAN -a -o on -S on -n standby,q -s (S/../.././02|L/../../6/01) -W 4,55,65 -m <nomailer> -M exec /usr/lib/bromigos/server/bromigos-server-disk-alert
