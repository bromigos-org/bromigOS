# bromigOS Server's Storage role (docs/server.md, "Roles"): Samba with no shares yet. Add a
# share below, then: sudo systemctl reload smb. This file is yours; bromigOS never replaces it.
[global]
   server role = standalone server
   server string = bromigOS Server
   map to guest = never
   server min protocol = SMB3
   load printers = no
   printing = bsd
   printcap name = /dev/null
   disable spoolss = yes
