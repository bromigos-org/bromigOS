# bromigOS Server's Home services role (docs/server.md, "Roles"): the format is described there.
schema = 1
id = "home-services"
kind = "role"
order = 30
title = "Home services"
summary = "Run apps for the household: photos, media, passwords, documents."
hint = "Each app gets its own name on your network. Most apps stay at the version they were installed with: they don't update by themselves yet. Caddy answers on the web ports, from your local network only."
offline = true
