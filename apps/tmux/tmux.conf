# bromigOS's tmux defaults (package bromigos-apps, /usr/share/bromigos/default/apps/tmux/tmux.conf).
# A user's ~/.config/tmux/tmux.conf (seeded by `bromigos apps setup`) sources this and adds
# its own; updates replace this file, never that one. Colours come from the current theme
# (the theme-set hook re-sources them into a running server).
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:Tc"
set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g escape-time 10
set -g focus-events on
set -g status-position top
set -g status-interval 5
set -g status-left-length 24
set -g status-right-length 48
set -g status-left " #S "
set -g status-right " #h · %H:%M "
setw -g window-status-format " #I #W "
setw -g window-status-current-format " #I #W "
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R
# the theme's colours, rendered by `bromigos theme set` (absent before the first theme set)
source-file -q ~/.local/state/bromigos/theme/current/tmux.conf
