# bromigOS's Chromium flags (package bromigos-apps). `bromigos apps setup` copies this to
# ~/.config/chromium-flags.conf once; after that it's yours. Chromium reads it at start.
# Native Wayland, and the compositor's input method; the window's frame colour follows the
# theme through the apps theme-set hook (--set-theme-color) while Chromium runs.
--ozone-platform-hint=auto
--enable-wayland-ime
--enable-features=TouchpadOverscrollHistoryNavigation
