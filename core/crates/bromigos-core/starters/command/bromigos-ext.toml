# __TITLE__: a bromigos command (made by `bromigos ext new command`; docs/extensions.md).
[extension]
name = "__NAME__"
version = "0.1.0"
description = "A bromigos command: says hello with the theme in force."
authors = []
licence = "MIT"
tags = ["command"]

[requires]
bromigos = ">=1.0, <2"

# bromigos-<group>-<name> runs as `bromigos <group> <name>`; bromigos-<group> as
# `bromigos <group>`. Its header (# bromigos:summary=…) puts it in `bromigos commands`
# and the menu.
[[provides]]
kind = "command"
path = "bromigos-__NAME__"

[permissions]
network = "none"
filesystem = []
code = true
