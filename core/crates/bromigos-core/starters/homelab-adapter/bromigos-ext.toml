# __TITLE__: a homelab adapter (made by `bromigos ext new homelab-adapter`;
# docs/extensions.md, docs/homelab.md "Adapters").
[extension]
name = "__NAME__"
version = "0.1.0"
description = "A homelab adapter: this machine as a host (CPU, memory, disk, load)."
authors = []
licence = "MIT"
tags = ["homelab", "adapter"]

[requires]
bromigos = ">=1.0, <2"

[[provides]]
kind = "homelab-adapter"
path = "adapter.py"
name = "__IDENT__"

# An adapter runs inside VECTOR's homelab tools and the desktop's panels. One that talks
# to a service lists its hosts here (or "any" when the user picks the endpoint).
[permissions]
network = "none"
filesystem = ["/proc/stat", "/proc/meminfo", "/proc/loadavg"]
vector = "read"
code = true
