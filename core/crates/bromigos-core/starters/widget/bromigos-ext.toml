# __TITLE__: a desktop widget (made by `bromigos ext new widget`; docs/extensions.md).
[extension]
name = "__NAME__"
version = "0.1.0"
description = "A desktop panel: this machine's load average."
authors = []
licence = "MIT"
tags = ["widget"]

[requires]
bromigos = ">=1.0, <2"

[[provides]]
kind = "widget"
path = "widget.py"
name = "__IDENT__"              # the panel's name (layout.json's "plugins" can place it)

[permissions]
network = "none"
filesystem = []
code = true                     # a widget is Python the widgets run
