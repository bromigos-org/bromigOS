# Bromigos terminal palette (colours only; fonts and sizes untouched).
# Phosphor on void, with a full 16-colour map that keeps red/yellow/blue/magenta/cyan
# distinct so diffs, linters and prompts stay readable.
foreground            #c4f5bb
background            #000500
selection_foreground  #000500
selection_background  #39ff14
cursor                #39ff14
cursor_text_color     #000500
url_color             #3fe0c5
active_border_color   #39ff14
inactive_border_color #003b00
bell_border_color     #d4af37
visual_bell_color     #d4af37
mark1_background      #39ff14
mark2_background      #d4af37
mark3_background      #ff766f

# black
color0  #000500
color8  #4e6b4e
# red (danger)
color1  #ff766f
color9  #ff9d97
# green (phosphor)
