# VECTOR's scripted lines: the one place the installers' and the welcome tours' guide lines
# live, with the clips that speak them (docs/voice-guide.md).
#
# Each table is one line. Its quoted name is the line's id, `<surface>.<step>`, and never
# changes once code uses it:
#
#   installer.*     the installers (graphical and text); `.short` is the text installer's
#                   narrower rail, where it says less
#   tour.*          the desktop's welcome tour (bromigos-welcome)
#   server-tour.*   bromigOS Server's welcome tour (bromigos welcome-console)
#
# Keys:
#   text   what VECTOR says, word for word: the caption and the clip's script. {name}
#          fills in at run time (bromigos_guide.line(id, who="Windows")).
#   where  where it's said, for whoever reads this file
#   say    for a line with a {name}: the values that get a clip of their own. A value the
#          list doesn't have plays the clip of `fallback` (the caption still says the real
#          one). A value whose first word is in the list, such as "Windows 11", plays that
#          word's clip.
#
# After changing a text, run tools/voice/make-clips.py: it speaks the new and changed lines
# in VECTOR's voice and removes the clips nothing uses. `make-clips.py --check` (CI) fails
# when a line has no clip, or its clip says older words.

format = 1

# ---------------------------------------------------------------- the installers

["installer.auto"]
