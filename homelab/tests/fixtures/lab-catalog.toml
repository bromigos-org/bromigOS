# A small, made-up lab model catalog for the planner's tests (tests/test_lab_catalog.py).
# The numbers are round on purpose: the tests check the logic, not the research.
format = 1
version = 1
researched = "2026-10-01"

[licence.apache-2]
name = "Apache 2.0"
commercial = "yes"
permissive = true

[licence.research]
name = "Research licence"
commercial = "no"

[licence.regional]
name = "Regional community licence"
commercial = "conditional"
conditions = "under 100M monthly users"
territory = ["EU", "UK", "KR"]

[capability.llm]
