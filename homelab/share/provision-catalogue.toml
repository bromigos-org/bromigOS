hint = "Your lab runs Headscale (bromigos lab network). With a join code from the lab, this server joins now; starting a new lab, the welcome tour sets the network up. No ports are opened to the internet."
icon = "network-vpn-symbolic"
glyph = "remote"
needs = []
conflicts = []
roles = ["lab-node"]
lab = ["new", "join"]
requires = {}
size_text = "nothing new: Tailscale's client comes with every Server"
ports = []
internet = true
install = { step = "lab-network" }

[[item]]
id = "adblock"
group = "network"
name = "Ad blocking (AdGuard Home)"
line = "Blocks ads and trackers for every device in the house."
hint = "AdGuard Home answers your network's DNS questions and drops the ones for ads and trackers. Point your router's DNS at this server afterwards. Its setup page opens on port 3000 the first time."
icon = "security-high-symbolic"
glyph = "shield"
needs = []
conflicts = []
roles = ["home-services"]
default = false
requires = { cpu = 1, ram_gb = 0.25, disk_gb = 1 }
size_text = "about 9 MB download"
ports = [53, 3000]
internet = true
install = { step = "adblock" }

# ------------------------------------------------------------------ Storage
[[item]]
id = "smb-shares"
group = "storage"
name = "Windows and Mac shares (SMB)"
