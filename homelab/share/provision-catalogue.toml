# ------------------------------------------------------------------ Lab core
[[item]]
id = "k3s"
group = "lab-core"
name = "Kubernetes (k3s)"
job = "Cluster"
app = "k3s"
line = "Runs your lab's apps across its machines."
hint = "k3s is a small Kubernetes. Starting a new lab makes this server the cluster's first machine; joining a lab makes it a worker your lab can give jobs to. Its version is the lab's pinned one, fetched from k3s's own site."
icon = "network-server-symbolic"
glyph = "lab"
holo = "cluster"
needs = []
conflicts = []
roles = ["lab-node"]
requires = { cpu = 2, ram_gb = 2, disk_gb = 10 }
size_text = "about 70 MB download"
ports = [6443, 10250]
internet = true
modes = ["server", "agent"]
install = { step = "k3s" }
note = "Joining a lab: your lab adds this server to its cluster from your desktop (bromigos lab provision add-node), unless you give its join address and token here."
[item.setup]
title = "Join a cluster"
intro = "Only when joining a lab's cluster from here. Leave it empty and your lab adds this server from your desktop."
[[item.setup.field]]
id = "server_url"
label = "The cluster's address"
kind = "text"
default = ""
help = "Such as https://192.0.2.10:6443. Your lab's desktop shows it."
[[item.setup.field]]
id = "token"
label = "The cluster's join token"
kind = "secret"
help = "Kept in the secret store; never written to a file in plain text."

[[item]]
id = "argocd"
group = "lab-core"
name = "Argo CD"
job = "Apps from Git"
app = "Argo CD"
line = "Keeps the lab's apps the way your lab's Git repository says."
hint = "Argo CD watches your lab repository and applies every change to the cluster, so the repository is the single place your lab is described. It needs Kubernetes."
icon = "emblem-system-symbolic"
glyph = "update"
holo = "cluster"
needs = ["k3s"]
conflicts = []
roles = ["lab-node"]
lab = ["new"]
requires = { cpu = 1, ram_gb = 1, disk_gb = 2 }
size_text = "about 400 MB of images"
ports = []
internet = true
install = { step = "helm-chart" }
note = "Point it at your lab repository afterwards (bromigos lab provision --git-url on your desktop)."

[[item]]
id = "vault"
group = "lab-core"
name = "Vault (OpenBao)"
job = "Lab secrets"
app = "OpenBao"
line = "Keeps the lab's passwords and keys in one locked place."
hint = "OpenBao is the open-source Vault, compatible with HashiCorp Vault's apps and tools. It stores the lab's secrets, encrypted, and other servers in the lab keep their keys there too. It starts sealed: the welcome tour shows its unseal and recovery keys once, as text and a QR code."
icon = "dialog-password-symbolic"
glyph = "key"
holo = "passwords"
needs = []
conflicts = []
roles = ["lab-node"]
lab = ["new"]
requires = { cpu = 1, ram_gb = 0.5, disk_gb = 2 }
size_text = "about 60 MB download"
ports = [8200]
internet = true
install = { step = "openbao" }
note = "Its audit log is on, and this server gets its own policy and key path."

[[item]]
id = "external-secrets"
group = "lab-core"
name = "External Secrets"
job = "Keys for cluster apps"
app = "External Secrets Operator"
line = "Gives the cluster's apps their keys from Vault, never from files in Git."
hint = "The External Secrets Operator copies each app's keys from the lab's Vault (or OpenBao) into the cluster when the app needs them, so your lab repository holds only references."
icon = "channel-secure-symbolic"
glyph = "lock"
holo = "passwords"
needs = ["k3s"]
conflicts = []
roles = ["lab-node"]
lab = ["new", "join"]
requires = { cpu = 1, ram_gb = 0.25, disk_gb = 1 }
size_text = "about 100 MB of images"
ports = []
internet = true
install = { step = "helm-chart" }

[[item]]
id = "monitoring"
group = "lab-core"
name = "Monitoring"
job = "Monitoring"
app = "Prometheus and Grafana"
line = "Graphs and alerts for this server: Prometheus and Grafana."
hint = "Prometheus collects the numbers (the node exporter every Server has already serves them) and Grafana draws them. If your lab already has monitoring, leave this off: the lab's own Prometheus reads this server."
icon = "preferences-system-details-symbolic"
glyph = "info"
holo = "uptime"
needs = []
conflicts = []
roles = ["lab-node"]
lab = ["new", "none"]
requires = { cpu = 1, ram_gb = 1, disk_gb = 5 }
size_text = "about 170 MB download"
ports = [9090, 3005]
web = { name = "graphs", port = 3005 }
internet = true
install = { step = "monitoring" }
secrets = ["grafana-admin"]

[[item]]
id = "backups"
# 2: the lab's own backup is one job with a record (labbackup.py), and names /srv/apps. A server that has it gets this at its next apply
version = 2
group = "lab-core"
name = "Backups"
job = "Backups"
app = "restic"
line = "Nightly encrypted backups of this server's apps and settings."
hint = "restic copies /etc, the apps' data under /srv and bromigOS's state to a folder, a USB disk or an S3 bucket, encrypted and deduplicated. A snapshot isn't a backup: it lives on the same disk."
icon = "media-tape-symbolic"
glyph = "rollback"
holo = "backups"
needs = []
conflicts = []
roles = ["lab-node", "storage", "home-services", "game-server", "media", "base"]
requires = { cpu = 1, ram_gb = 0.5, disk_gb = 1 }
size_text = "about 11 MB download"
ports = []
internet = true
install = { step = "backups" }
secrets = ["restic-password"]
[item.setup]
title = "Where backups go"
[[item.setup.field]]
id = "repository"
label = "Backup place"
kind = "text"
default = "/srv/backups/restic"
help = "A folder (best on another disk), sftp:user@host:/path, or s3:https://host/bucket."

[[item]]
id = "caddy"
group = "lab-core"
name = "Caddy"
job = "Front door"
app = "Caddy"
line = "One front door with HTTPS for every web app here."
hint = "Caddy answers on ports 80 and 443 and sends each name (photos-<server>.local, …) to the right app, with a certificate from its own local authority. Only your local network can reach it."
icon = "web-browser-symbolic"
glyph = "shield"
holo = "front-door"
needs = []
conflicts = []
roles = ["home-services", "media"]
requires = { cpu = 1, ram_gb = 0.25, disk_gb = 1 }
size_text = "about 15 MB download"
ports = [80, 443]
internet = true
install = { step = "caddy" }

[[item]]
id = "board"
group = "lab-core"
name = "Lab board"
job = "Lab board"
app = "bromigOS"
line = "This server's own page: its apps, its drives, its backups and what it's doing."
hint = "Open https://<server>.local in a browser on your home network. Before you sign in it shows the apps to open; signed in with a code from sudo bromigos server board code, it shows everything. Only your home network and your lab's private network can reach it."
icon = "view-grid-symbolic"
glyph = "bromigos"
holo = "board"
needs = ["caddy"]
conflicts = ["start-page"]
roles = ["home-services", "media", "storage", "game-server"]
# a small Python service (about 50 MB) and a reader that runs only while a browser is open
requires = { cpu = 1, ram_gb = 0.1, disk_gb = 1 }
size_text = "about 1 MB package"
ports = []
internet = true
install = { step = "board" }
# no health check here: it has no port of its own (Caddy's 443 serves it) and keeps no data
# under /srv/apps; its sessions are in /var/lib/bromigos-board (docs/board.md)

[[item]]
id = "start-page"
group = "lab-core"
name = "Start page"
job = "Start page"
app = "Homepage"
line = "One page with a link to everything this server runs."
hint = "Homepage lists every app you ticked, with whether it's up. The Lab board replaces it: it stays here for servers that have it."
icon = "view-grid-symbolic"
glyph = "bromigos"
holo = "board"
needs = []
# the Lab board answers at home-<server>.local too
conflicts = ["board"]
roles = ["home-services", "media"]
default = false
requires = { cpu = 1, ram_gb = 0.25, disk_gb = 1 }
size_text = "about 90 MB image"
ports = [3010]
web = { name = "home", port = 3010 }
internet = true
install = { quadlet = "start-page" }
images = { homepage = "ghcr.io/gethomepage/homepage:v2.7.0@sha256:19c5c09184458a41b7b5915e71463a39f36cd33540f41bdbed008791b8182d5f" }
# Homepage's own Dockerfile HEALTHCHECK and src/pages/api/healthcheck.js
health = { http = "/api/healthcheck", port = 3010 }
[[item.data]]
path = "config"
kind = "config"
what = "The start page's settings and its list of links, written again on every set-up."

# ------------------------------------------------------------------ AI
[[item]]
