  { id = "protonvpn", label = "Proton VPN", note = "Supports port forwarding (better for torrents)", url = "https://protonvpn.com/" },
  { id = "mullvad", label = "Mullvad", note = "No port forwarding since 2023", url = "https://mullvad.net/" },
]
