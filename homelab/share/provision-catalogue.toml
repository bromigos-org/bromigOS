icon = "folder-download-symbolic"
glyph = "copy"
holo = "downloads"
needs = ["ollama|vllm"]
conflicts = []
roles = ["lab-node"]
lab = ["new", "none"]
requires = { gpu = true }
size_text = "depends on the models: 2 to 40 GB"
ports = []
internet = true
install = { step = "models" }

[[item]]
id = "voice"
