# What a bromigOS Server (or any lab machine) can run, as items to tick: the provisioning
# catalogue (docs/lab-provision.md, "The local target"; manual/src/lab.md, "Choosing what a
# server runs"). `bromigos lab provision --local` reads it, and so do the Server installer's
# and the first-boot tour's checklists, through bromigos_homelab.provcatalog.
#
# Installed as /usr/share/bromigos/lab/provision-catalogue.toml (bromigos-lab).
#
# [[group]]   id, name, icon (an Adwaita symbolic icon), glyph (a key of bromigos_textual's ICONS)
# [[item]]
#   id, group, name    the item, the group it's listed in, its name on the card
#   job, app           the two halves of the name, apart: the job it does ("Photos") and the
#                      program that does it ("Immich"). A tile is titled by the job, with the app
#                      under it. No app: the item is a folder or a setting, not a program
#   line               one plain sentence under the name
#   hint               the hover text: what it does and why you'd want it
#   icon, glyph        as for groups
#   holo               our own icon for the job, by id (provcatalog.HOLO). Items that do the same
#                      kind of job share one
#   needs              items it can't run without; "a|b" means either (the first is ticked for you)
#   conflicts          items it can't run beside
#   roles              the Server roles that tick it: lab-node, storage, home-services,
#                      game-server, media, base
#   default            false: listed under its role but never ticked for you (default true)
#   lab                ticked for these lab answers only: new, join, none (default: all three)
#   requires           { cpu, ram_gb, disk_gb, gpu = bool, gpu_vram_gb, gpu_vendor }
#   size_text          what it downloads, in words
#   ports              host ports it listens on
#   web                { name, port, path }: its page, on one of `ports`. With a name, Caddy serves
#                      it as https://<name>-<server>.local and the start page links to it; without
#                      one the page is on its port only (http://<server>.local:<port><path>)
#   internet           true: it needs a download (packages, images or models)
#   modes              k3s only: server, agent
#   install            how: { pacman = [...] } (with nvidia = [...] / amd = [...] in place of
#                      pacman on that GPU), { quadlet = "<template>" } (share/quadlet/<template>),
#                      or { step = "<step>" } (localprovision.STEPS)
#   enable             systemd units started after a pacman install
#   images             { name = "registry/image:tag@sha256:…" }: a quadlet template's images,
#                      always pinned by digest
#   health             how to ask "does it answer?", one of:
#                      { http = "/path", port, expect, within_s }: a GET to 127.0.0.1:<port><http>
#                        with nothing signed in and no redirect followed. `expect` is the status of
#                        that first answer (a number or a list; 200 when left out). `port` is one
#                        of `ports`
#                      { cmd = ["podman", "exec", CONTAINER, …], within_s }: a command inside one
#                        of the item's own containers; exit 0 means it answers
#                      `within_s`: how long a start may take before "no answer" counts, when the
#                      app's own project says. Each check here is the app's own (its image's
#                      HEALTHCHECK, its documented path): the comment above it says which. An item
#                      with none says why in a comment
#   secrets            names generated for it the first time (database passwords, API keys);
#                      they live in the secret store, never in a config file
#   note               a plain sentence the plan shows
#   [[item.data]]      one for each folder or file the item keeps under its own folder,
#                      /srv/apps/<id> ({{data}} in its template): path (inside that folder), kind,
#                      and what (a sentence: what is in it). A quadlet item lists exactly its
#                      template's {{data}} volumes. kind is one of:
#                        library   your own files (photos, documents, a game's world)
#                        database  the app's records of what you did in it: accounts, history,
#                                  what you follow
#                        config    its settings and working files (a queue, its own backups)
#                        cache     safe to lose: downloaded or made again when missing
#   version            the recipe's own revision, 1 when left out. Raised when what the engine writes
#                      for the item changed (a unit, a settings file): the engine sets the item up
#                      again at the next apply on a server that has it (localprovision.fingerprint)
#   [item.setup]       a small form the UIs render: title, intro, check (the --check name),
#                      [[item.setup.field]] {id, label, kind = text|number|bool|choice|secret|path,
#                      default, help, choices = [{id, label, note, url}], show_if = {field = [values]},
#                      secret_for = [choice ids that need it]}, [[item.setup.action]] {label, url}
#
# Read by the reader and filled by no item yet (the app manager's later steps fill them:
# docs/lab-provision.md, "The catalogue"): homepage, licence, remove_note, app_version, changed,
# track, status and status_note, download_mb, [item.update] and [item.tile]. A key that isn't in this header is a mistake:
# `validate()` names it.
#
# Images are pinned by digest. Nothing moves the digests yet: no CI job does, and no template
# sets AutoUpdate, so a container app stays at the version pinned here until this file changes
# and the server applies it again (docs/lab-provision.md, "Updates"; the job that tests and
# moves them is planned there). Items installed as packages update with the system.
format = 2

