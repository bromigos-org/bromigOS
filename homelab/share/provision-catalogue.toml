[[item]]
id = "s3"
group = "storage"
name = "S3 bucket server (RustFS)"
line = "An S3-compatible store for backups and apps that want buckets."
hint = "RustFS speaks Amazon's S3 protocol, the same as your lab's. Other servers back up into it, and apps that store files in buckets use it."
icon = "drive-harddisk-symbolic"
glyph = "cloud"
needs = []
conflicts = []
roles = ["storage"]
requires = { cpu = 1, ram_gb = 1, disk_gb = 5 }
size_text = "about 80 MB image"
ports = [9000, 9001]
internet = true
