# What a bromigOS Server (or any lab machine) can run, as items to tick: the provisioning
# catalogue (docs/lab-provision.md, "The local target"; manual/src/lab.md, "Choosing what a
# server runs"). `bromigos lab provision --local` reads it, and so do the Server installer's
# and the first-boot tour's checklists, through bromigos_homelab.provcatalog.
#
# Installed as /usr/share/bromigos/lab/provision-catalogue.toml (bromigos-lab).
#
# [[group]]   id, name, icon (an Adwaita symbolic icon), glyph (a key of bromigos_textual's ICONS)
# [[item]]
#   id, group, name    the item, the group it's listed in, its name on the card
#   line               one plain sentence under the name
#   hint               the hover text: what it does and why you'd want it
#   icon, glyph        as for groups
#   needs              items it can't run without; "a|b" means either (the first is ticked for you)
#   conflicts          items it can't run beside
#   roles              the Server roles that tick it: lab-node, storage, home-services,
#                      game-server, media, base
#   default            false: listed under its role but never ticked for you (default true)
#   lab                ticked for these lab answers only: new, join, none (default: all three)
#   requires           { cpu, ram_gb, disk_gb, gpu = bool, gpu_vram_gb, gpu_vendor }
#   size_text          what it downloads, in words
#   ports              host ports it listens on
#   internet           true: it needs a download (packages, images or models)
#   modes              k3s only: server, agent
#   install            how: { pacman = [...] } (with nvidia = [...] / amd = [...] in place of
#                      pacman on that GPU), { quadlet = "<template>" } (share/quadlet/<template>),
#                      or { step = "<step>" } (localprovision.STEPS)
#   enable             systemd units started after a pacman install
#   images             { name = "registry/image:tag@sha256:…" }: a quadlet template's images,
#                      always pinned by digest
#   secrets            names generated for it the first time (database passwords, API keys);
#                      they live in the secret store, never in a config file
#   note               a plain sentence the plan shows
#   [item.setup]       a small form the UIs render: title, intro, check (the --check name),
#                      [[item.setup.field]] {id, label, kind = text|number|bool|choice|secret|path,
#                      default, help, choices = [{id, label, note, url}], show_if = {field = [values]},
#                      secret_for = [choice ids that need it]}, [[item.setup.action]] {label, url}
#
# Images are pinned by digest; CI moves the digests (the same job as the lab's charts).
format = 1

[[group]]
id = "lab-core"
name = "Lab core"
icon = "network-server-symbolic"
glyph = "lab"

[[group]]
id = "ai"
name = "AI"
icon = "applications-science-symbolic"
glyph = "vector"

[[group]]
id = "network"
name = "Network"
icon = "network-workgroup-symbolic"
glyph = "network"

[[group]]
id = "storage"
name = "Storage"
icon = "drive-multidisk-symbolic"
glyph = "disk"

[[group]]
id = "games"
name = "Games"
icon = "input-gaming-symbolic"
glyph = "server"

[[group]]
id = "home"
name = "Home apps"
icon = "go-home-symbolic"
glyph = "people"

[[group]]
id = "media"
name = "Media"
icon = "applications-multimedia-symbolic"
glyph = "computer"

[[group]]
id = "brodec"
name = "BRODEC"
icon = "phone-symbolic"
glyph = "phone"

# ------------------------------------------------------------------ Lab core
[[item]]
id = "k3s"
group = "lab-core"
name = "Kubernetes (k3s)"
line = "Runs your lab's apps across its machines."
hint = "k3s is a small Kubernetes. Starting a new lab makes this server the cluster's first machine; joining a lab makes it a worker your lab can give jobs to. Its version is the lab's pinned one, fetched from k3s's own site."
icon = "network-server-symbolic"
glyph = "lab"
needs = []
conflicts = []
roles = ["lab-node"]
requires = { cpu = 2, ram_gb = 2, disk_gb = 10 }
size_text = "about 70 MB download"
ports = [6443, 10250]
internet = true
modes = ["server", "agent"]
install = { step = "k3s" }
note = "Joining a lab: your lab adds this server to its cluster from your desktop (bromigos lab provision add-node), unless you give its join address and token here."
[item.setup]
title = "Join a cluster"
intro = "Only when joining a lab's cluster from here. Leave it empty and your lab adds this server from your desktop."
[[item.setup.field]]
id = "server_url"
label = "The cluster's address"
kind = "text"
default = ""
help = "Such as https://192.0.2.10:6443. Your lab's desktop shows it."
[[item.setup.field]]
id = "token"
label = "The cluster's join token"
kind = "secret"
help = "Kept in the secret store; never written to a file in plain text."

[[item]]
id = "argocd"
group = "lab-core"
name = "Argo CD"
line = "Keeps the lab's apps the way your lab's Git repository says."
hint = "Argo CD watches your lab repository and applies every change to the cluster, so the repository is the single place your lab is described. It needs Kubernetes."
icon = "emblem-system-symbolic"
glyph = "update"
needs = ["k3s"]
conflicts = []
roles = ["lab-node"]
lab = ["new"]
requires = { cpu = 1, ram_gb = 1, disk_gb = 2 }
size_text = "about 400 MB of images"
ports = []
internet = true
install = { step = "helm-chart" }
note = "Point it at your lab repository afterwards (bromigos lab provision --git-url on your desktop)."

[[item]]
id = "vault"
group = "lab-core"
name = "Vault (OpenBao)"
line = "Keeps the lab's passwords and keys in one locked place."
hint = "OpenBao is the open-source Vault, compatible with HashiCorp Vault's apps and tools. It stores the lab's secrets, encrypted, and other servers in the lab keep their keys there too. It starts sealed: the welcome tour shows its unseal and recovery keys once, as text and a QR code."
icon = "dialog-password-symbolic"
glyph = "key"
needs = []
conflicts = []
roles = ["lab-node"]
lab = ["new"]
requires = { cpu = 1, ram_gb = 0.5, disk_gb = 2 }
size_text = "about 60 MB download"
ports = [8200]
internet = true
install = { step = "openbao" }
note = "Its audit log is on, and this server gets its own policy and key path."

[[item]]
id = "external-secrets"
group = "lab-core"
name = "External Secrets"
line = "Gives the cluster's apps their keys from Vault, never from files in Git."
hint = "The External Secrets Operator copies each app's keys from the lab's Vault (or OpenBao) into the cluster when the app needs them, so your lab repository holds only references."
icon = "channel-secure-symbolic"
glyph = "lock"
needs = ["k3s"]
conflicts = []
roles = ["lab-node"]
lab = ["new", "join"]
requires = { cpu = 1, ram_gb = 0.25, disk_gb = 1 }
size_text = "about 100 MB of images"
ports = []
internet = true
install = { step = "helm-chart" }

[[item]]
id = "monitoring"
group = "lab-core"
name = "Monitoring"
line = "Graphs and alerts for this server: Prometheus and Grafana."
hint = "Prometheus collects the numbers (the node exporter every Server has already serves them) and Grafana draws them. If your lab already has monitoring, leave this off: the lab's own Prometheus reads this server."
icon = "preferences-system-details-symbolic"
glyph = "info"
needs = []
conflicts = []
roles = ["lab-node"]
lab = ["new", "none"]
requires = { cpu = 1, ram_gb = 1, disk_gb = 5 }
size_text = "about 170 MB download"
ports = [9090, 3005]
internet = true
install = { step = "monitoring" }
secrets = ["grafana-admin"]

[[item]]
id = "backups"
group = "lab-core"
name = "Backups"
line = "Nightly encrypted backups of this server's apps and settings."
hint = "restic copies /etc, the apps' data under /srv and bromigOS's state to a folder, a USB disk or an S3 bucket, encrypted and deduplicated. A snapshot isn't a backup: it lives on the same disk."
icon = "media-tape-symbolic"
glyph = "rollback"
needs = []
conflicts = []
roles = ["lab-node", "storage", "home-services", "game-server", "media", "base"]
requires = { cpu = 1, ram_gb = 0.5, disk_gb = 1 }
size_text = "about 11 MB download"
ports = []
internet = true
install = { step = "backups" }
secrets = ["restic-password"]
[item.setup]
title = "Where backups go"
[[item.setup.field]]
id = "repository"
label = "Backup place"
kind = "text"
default = "/srv/backups/restic"
help = "A folder (best on another disk), sftp:user@host:/path, or s3:https://host/bucket."

[[item]]
id = "caddy"
group = "lab-core"
name = "Caddy"
line = "One front door with HTTPS for every web app here."
hint = "Caddy answers on ports 80 and 443 and sends each name (photos-<server>.local, …) to the right app, with a certificate from its own local authority. Only your local network can reach it."
icon = "web-browser-symbolic"
glyph = "shield"
needs = []
conflicts = []
roles = ["home-services", "media"]
requires = { cpu = 1, ram_gb = 0.25, disk_gb = 1 }
size_text = "about 15 MB download"
ports = [80, 443]
internet = true
install = { step = "caddy" }

[[item]]
id = "start-page"
group = "lab-core"
name = "Start page"
line = "One page with a link to everything this server runs."
hint = "Homepage lists every app you ticked, with whether it's up. Open it first when you don't remember an app's address."
icon = "view-grid-symbolic"
glyph = "bromigos"
needs = []
conflicts = []
roles = ["home-services", "media"]
requires = { cpu = 1, ram_gb = 0.25, disk_gb = 1 }
size_text = "about 90 MB image"
ports = [3010]
internet = true
install = { quadlet = "start-page" }
images = { homepage = "ghcr.io/gethomepage/homepage:v2.7.0@sha256:19c5c09184458a41b7b5915e71463a39f36cd33540f41bdbed008791b8182d5f" }

# ------------------------------------------------------------------ AI
[[item]]
id = "vector-bridge"
group = "ai"
name = "VECTOR's lab bridge"
line = "Lets VECTOR on your phone see and talk to this lab."
hint = "brodec-lab reads the lab's monitoring and reports to your BRODEC account, end to end encrypted. It only reads. It stays off until you pair it in the welcome tour."
icon = "chat-message-new-symbolic"
glyph = "vector"
needs = []
conflicts = []
roles = ["lab-node"]
lab = ["new"]
requires = { cpu = 1, ram_gb = 0.25, disk_gb = 1 }
size_text = "about 28 MB download"
ports = []
internet = true
install = { pacman = ["brodec-lab"] }
note = "Pair it in the welcome tour (brodec-lab pair); its service starts after that."

[[item]]
id = "litellm"
group = "ai"
name = "LiteLLM gateway"
line = "One OpenAI-style address, with keys, in front of your model servers."
hint = "VECTOR's brain and your apps ask LiteLLM, and it passes each request to the model server that has the model. Keys for cloud providers, if you add any, stay in the secret store."
icon = "network-transmit-receive-symbolic"
glyph = "remote"
needs = ["ollama|vllm"]
conflicts = []
roles = ["lab-node"]
lab = ["new", "none"]
requires = { cpu = 1, ram_gb = 1, disk_gb = 2, gpu = true }
size_text = "about 600 MB image"
ports = [4000]
internet = true
install = { quadlet = "litellm" }
images = { litellm = "ghcr.io/berriai/litellm:main-v1.83.14-stable@sha256:c81eb79cd4333c6cfe374c0ec929110fd23f0ee5f7fd198855a6fbddc77b83ba" }
secrets = ["master-key"]

[[item]]
id = "ollama"
group = "ai"
name = "Model serving (Ollama)"
line = "Runs open AI models on this server's GPU, or slowly on its processor."
hint = "Ollama loads the models you pick below and answers on port 11434. It works on NVIDIA and AMD cards, and on the processor alone for small models. The models come from the lab's model catalogue, sized to this server."
icon = "applications-science-symbolic"
glyph = "chip"
needs = []
conflicts = ["vllm"]
roles = ["lab-node"]
lab = ["new", "none"]
requires = { cpu = 4, ram_gb = 8, disk_gb = 20, gpu = true }
size_text = "about 20 MB download, 780 MB with NVIDIA's CUDA, 980 MB with AMD's ROCm"
ports = [11434]
internet = true
install = { pacman = ["ollama"], nvidia = ["ollama-cuda"], amd = ["ollama-rocm"] }
enable = ["ollama.service"]

[[item]]
id = "vllm"
group = "ai"
name = "Model serving (vLLM)"
line = "Fast model serving for NVIDIA cards with 16 GB or more."
hint = "vLLM serves one model to many users at once, with long contexts. Pick it over Ollama for a big NVIDIA card that VECTOR and your apps share."
icon = "applications-science-symbolic"
glyph = "chip"
needs = []
conflicts = ["ollama"]
roles = []
default = false
requires = { cpu = 8, ram_gb = 32, disk_gb = 80, gpu = true, gpu_vram_gb = 16, gpu_vendor = "nvidia" }
size_text = "about 10 GB image"
ports = [8000]
internet = true
install = { quadlet = "vllm" }
images = { vllm = "docker.io/vllm/vllm-openai:v0.32.0@sha256:befccf0e7e4089aa23926bb6f887a85c0d46c2a99e6de5c5ffdf5cb7957c5b34" }
note = "Needs NVIDIA's container toolkit (nvidia-container-toolkit); it's installed with it."

[[item]]
id = "models"
group = "ai"
name = "Models"
line = "Downloads the models you picked for the model server."
hint = "The list comes from the lab's model catalogue, sized to this server's GPU. Models are big downloads, so they wait for the internet."
icon = "folder-download-symbolic"
glyph = "copy"
needs = ["ollama|vllm"]
conflicts = []
roles = ["lab-node"]
lab = ["new", "none"]
requires = { gpu = true }
size_text = "depends on the models: 2 to 40 GB"
ports = []
internet = true
install = { step = "models" }

[[item]]
id = "voice"
group = "ai"
name = "Voice (speech in and out)"
line = "Speech to text and text to speech for VECTOR and your apps."
hint = "Speaches serves Whisper (hearing) and Kokoro (speaking) behind an OpenAI-style address on port 8001. It uses the GPU when there's an NVIDIA card, the processor otherwise."
icon = "audio-input-microphone-symbolic"
glyph = "vector"
needs = []
conflicts = []
roles = ["lab-node"]
default = false
requires = { cpu = 2, ram_gb = 4, disk_gb = 10 }
size_text = "about 1.5 GB image (4 GB with CUDA), plus the voice models"
ports = [8001]
internet = true
install = { quadlet = "voice" }
images = { voice = "ghcr.io/speaches-ai/speaches:0.8.3-cpu@sha256:21e3df06d842fb7802ab470dd77c25f0e8c0d22950e8d8c6ae886e851af53ef8", voice-nvidia = "ghcr.io/speaches-ai/speaches:0.8.3-cuda@sha256:9abc6968a883e77ead9286c38a6ccf3139dcad518b783deeebb7be2ced50e972" }

# ------------------------------------------------------------------ Network
[[item]]
id = "lab-network"
