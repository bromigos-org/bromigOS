health = { http = "/health/liveliness", port = 4000 }
secrets = ["master-key"]
[[item.data]]
path = "config.yaml"
kind = "config"
what = "Its list of models, written again on every set-up."

[[item]]
id = "ollama"
group = "ai"
name = "Model serving (Ollama)"
job = "Model serving"
app = "Ollama"
line = "Runs open AI models on this server's GPU, or slowly on its processor."
hint = "Ollama loads the models you pick below and answers on port 11434. It works on NVIDIA and AMD cards, and on the processor alone for small models. The models come from the lab's model catalogue, sized to this server."
icon = "applications-science-symbolic"
glyph = "chip"
holo = "model-serving"
needs = []
conflicts = ["vllm"]
roles = ["lab-node"]
lab = ["new", "none"]
requires = { cpu = 4, ram_gb = 8, disk_gb = 20, gpu = true }
size_text = "about 20 MB download, 780 MB with NVIDIA's CUDA, 980 MB with AMD's ROCm"
ports = [11434]
internet = true
install = { pacman = ["ollama"], nvidia = ["ollama-cuda"], amd = ["ollama-rocm"] }
enable = ["ollama.service"]

[[item]]
id = "vllm"
group = "ai"
name = "Model serving (vLLM)"
job = "Model serving"
app = "vLLM"
line = "Fast model serving for NVIDIA cards with 16 GB or more."
hint = "vLLM serves one model to many users at once, with long contexts. Pick it over Ollama for a big NVIDIA card that VECTOR and your apps share."
icon = "applications-science-symbolic"
glyph = "chip"
holo = "model-serving"
needs = []
conflicts = ["ollama"]
roles = []
default = false
requires = { cpu = 8, ram_gb = 32, disk_gb = 80, gpu = true, gpu_vram_gb = 16, gpu_vendor = "nvidia" }
size_text = "about 10 GB image"
ports = [8000]
internet = true
install = { quadlet = "vllm" }
images = { vllm = "docker.io/vllm/vllm-openai:v0.32.0@sha256:befccf0e7e4089aa23926bb6f887a85c0d46c2a99e6de5c5ffdf5cb7957c5b34" }
# vLLM's /health (its Kubernetes probes use it); it answers once the model is loaded, and the unit allows 900 s for that
health = { http = "/health", port = 8000, within_s = 900 }
note = "Needs NVIDIA's container toolkit (nvidia-container-toolkit); it's installed with it."
[[item.data]]
path = "cache"
kind = "cache"
what = "The models it downloaded."

[[item]]
id = "models"
group = "ai"
name = "Models"
job = "Models"
line = "Downloads the models you picked for the model server."
