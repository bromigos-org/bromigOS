glyph = "vector"

[[group]]
id = "network"
name = "Network"
icon = "network-workgroup-symbolic"
glyph = "network"

[[group]]
id = "storage"
name = "Storage"
icon = "drive-multidisk-symbolic"
glyph = "disk"

[[group]]
