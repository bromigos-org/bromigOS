note = "Pair it in the welcome tour (brodec-lab pair); its service starts after that."

[[item]]
id = "litellm"
group = "ai"
name = "LiteLLM gateway"
job = "Model gateway"
app = "LiteLLM"
line = "One OpenAI-style address, with keys, in front of your model servers."
hint = "VECTOR's brain and your apps ask LiteLLM, and it passes each request to the model server that has the model. Keys for cloud providers, if you add any, stay in the secret store."
icon = "network-transmit-receive-symbolic"
glyph = "remote"
holo = "model-serving"
needs = ["ollama|vllm"]
conflicts = []
roles = ["lab-node"]
lab = ["new", "none"]
requires = { cpu = 1, ram_gb = 1, disk_gb = 2, gpu = true }
size_text = "about 600 MB image"
ports = [4000]
internet = true
install = { quadlet = "litellm" }
images = { litellm = "ghcr.io/berriai/litellm:main-v1.83.14-stable@sha256:c81eb79cd4333c6cfe374c0ec929110fd23f0ee5f7fd198855a6fbddc77b83ba" }
