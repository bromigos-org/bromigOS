[preset.ai]
title = "AI"
summary = "local LLMs behind LiteLLM, ComfyUI with models for your VRAM, voice and hearing, chat and search"
services = ["ollama", "litellm", "comfyui", "voice", "whisper", "open-webui", "searxng"]
choose = { "llm-server" = ["vllm when an NVIDIA GPU has 24 GB or more", "ollama otherwise"] }

[preset.games]
title = "Game server"
summary = "Pelican's panel and Wings, with Minecraft Paper ready"
services = ["pelican-panel", "pelican-wings"]

[preset.media]
title = "Media"
summary = "Jellyfin, the arr apps, and Pinchflat for YouTube; Plex too, if you want it (it needs a free Plex account)"
services = ["jellyfin", "arr", "pinchflat"]
offered = ["plex"]

[preset.home]
title = "Home"
summary = "Home Assistant"
services = ["home-assistant"]

[preset.advanced]
title = "Advanced"
summary = "Prometheus, Grafana and Loki; Vault; Kubernetes with Argo CD"
services = ["kubernetes", "helm", "argocd", "vault"]
offered = ["prometheus", "grafana", "loki"]

# ------------------------------------------------------------------ storage: the NAS you already have
# The Storage step (docs/lab-provision.md) finds the NASes on the network, or takes an address,
# lists their shares, and asks for one share per purpose. It checks each by writing a test file
# and deleting it. Databases and scratch space ("state", "scratch" in a service's mounts) never
# go on a share: they stay on the box's own disk.
[storage]
protocols = ["nfs", "smb"]
prefer = "nfs"                  # for media on Linux; SMB works too
discover = ["mdns:_nfs._tcp", "mdns:_smb._tcp", "showmount -e <address>"]
check = "write a test file in each share, read it back, delete it"

[storage.purpose.media]
title = "Media"
summary = "films, shows, music and YouTube downloads: what Jellyfin and Plex play"
folders = ["movies", "tv", "music", "youtube"]

[storage.purpose.downloads]
title = "Downloads"
summary = "where downloads land before the arr apps sort them into media. On the same share as media, moving them is instant"
folders = ["downloads"]

[storage.purpose.backups]
title = "Backups"
summary = "restic's encrypted backups of the lab's data and settings"
folders = ["restic"]

# how a chosen share is attached, per target
[storage.apply]
linux = "systemd automount units, NFS or CIFS; SMB credentials in a sops-encrypted file in the lab repo"
kubernetes = "an NFS StorageClass through nfs-subdir-external-provisioner, or static PersistentVolumes"
proxmox = "the share added as Proxmox storage (pvesm add nfs, or POST /storage), or mounted inside the VM"
helm = { repo = "https://kubernetes-sigs.github.io/nfs-subdir-external-provisioner/", name = "nfs-subdir-external-provisioner", version = "4.0.18" }

# What each NAS brand needs. creates_shares: setup can make the share through the NAS's API;
# otherwise it gives the steps and uses a share you made. squash: the setting that makes the
# NAS write every file as one user, so every service can read every file. fix: what to change
# when the write test fails.
[storage.brand.generic]
title = "Any NFS or SMB share"
creates_shares = false
squash = "map all users to one user (NFS all_squash, with anonuid and anongid)"
fix = "Give the box's address read and write access to the share. For NFS, map all users to one user that owns the folder."

[storage.brand.linux]
title = "A Linux NFS server"
creates_shares = false
export = "<folder> <lab network>/24(rw,sync,no_subtree_check,all_squash,anonuid=<uid>,anongid=<gid>)"
squash = "all_squash with anonuid and anongid in /etc/exports"
fix = "Add the box's network to the export in /etc/exports with rw and all_squash, then run exportfs -ra."
docs = "https://man7.org/linux/man-pages/man5/exports.5.html"

[storage.brand.truenas]
title = "TrueNAS (25.04 or later)"
creates_shares = true
api = "JSON-RPC 2.0 over a WebSocket, wss://<nas>/api/current, with an API key"
create = ["pool.dataset.create", "sharing.nfs.create", "sharing.smb.create"]
health = ["pool.query", "pool.dataset.query"]
key = "Your account icon › My API Keys › Add API Key. It's shown once, and works over HTTPS only."
squash = "mapall_user and mapall_group on the NFS share"
fix = "In Shares › NFS, edit the share: add the box's network, and set Mapall User and Mapall Group to the folder's owner."
docs = "https://api.truenas.com/"

[storage.brand.synology]
title = "Synology (DSM 7)"
creates_shares = false          # no published API for shared folders or NFS rules
steps = ["Control Panel › File Services › NFS: tick Enable NFS service, then Apply.",
         "Control Panel › Shared Folder › Create: name the folder and pick its volume.",
         "Select the folder › Edit › NFS Permissions › Create: the box's address, Read/Write, and Squash set to Map all users to admin."]
squash = "Map all users to admin"
fix = "Shared Folder › Edit › NFS Permissions: give the box's address Read/Write, with Squash set to Map all users to admin."
docs = "https://kb.synology.com/en-us/DSM/help/DSM/AdminCenter/file_share_privilege_nfs?version=7"

[storage.brand.unifi]
title = "UniFi Drive (UNAS)"
creates_shares = false          # UniFi documents no API for UniFi Drive's shares or health
steps = ["UniFi Drive › All Files › New Shared Drive: name it and add users.",
         "UniFi Drive › Settings › Services: turn on NFS.",
         "On the Shared Drive, choose Collaborative Mode (All Squash). Don't choose Isolated Mode: it can't be undone, and the drive becomes NFS-only."]
export = "<nas>:/var/nfs/shared/<Shared Drive name>"
squash = "Collaborative Mode (All Squash)"
fix = "In UniFi Drive, check NFS is on (Settings › Services) and the Shared Drive uses Collaborative Mode (All Squash)."
docs = "https://help.ui.com/hc/en-us/articles/26277250895895"

[storage.brand.qnap]
title = "QNAP (QTS, QuTS hero)"
creates_shares = false          # no current published API for shared folders or NFS
steps = ["Control Panel › Network & File Services › Win/Mac/NFS/WebDAV › NFS Service: tick Enable NFS service.",
         "Control Panel › Privilege › Shared Folders: create the folder.",
         "Edit Shared Folder Permission › NFS host access: tick Access right, add the box's address, Read/Write, Squash all users."]
squash = "Squash all users"
fix = "Shared Folders › Edit Shared Folder Permission › NFS host access: add the box's address with Read/Write and Squash all users."
docs = "https://www.qnap.com/en/how-to/faq/article/how-to-know-whether-the-nas-shared-folder-is-opened-for-access-via-nfs"

[storage.brand.unraid]
title = "Unraid (7)"
creates_shares = false          # its API reads shares and disks but can't make shares yet
health = ["array", "shares", "disks"]
api = "GraphQL at /graphql with an x-api-key header (built in from 7.2)"
steps = ["Shares › Add Share: name it and choose where it's stored.",
         "Turn on NFS in Unraid's settings.",
         "Open the share: set NFS Export to Yes, and Security to Private with a rule for the box's address."]
squash = "the share's NFS Security rule"
fix = "Open the share in Shares: NFS Export Yes, and a Private rule giving the box's address read and write."
docs = "https://docs.unraid.net/unraid-os/using-unraid-to/manage-storage/shares/"

# ------------------------------------------------------------------ sizing
[sizing]
vram_tiers = ["cpu", 8, 12, 16, 24, 32, 48, 80]
# headroom kept on the box beyond the services' needs: the OS, page cache, a build
ram_headroom_gib = 4
disk_headroom_pct = 15
# a GPU's VRAM beyond what resident models hold, kept for jobs (ComfyUI) and the voice's work
vram_job_headroom_gib = 2
# vLLM only with an NVIDIA GPU of at least this much VRAM; Ollama otherwise
vllm_min_vram_gib = 24
# the voice service: Qwen3-TTS on a GPU with this much VRAM free, else Kokoro on the CPU
voice_gpu_min_vram_gib = 8
# GPU drivers: only on these distributions, and always as a dry run first
gpu_driver_distros = ["debian", "ubuntu", "fedora", "arch"]
