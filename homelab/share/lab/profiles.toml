kind = "compose"
needs = { cpu = 1, ram_gib = 1, disk_gib = 4 }
ports = [8090]
provides = ["game-panel"]
depends = ["pelican-wings"]
exposes = "games"

[service.pelican-wings]
title = "Pelican Wings"
summary = "runs the game servers the panel manages (Minecraft Paper by default)"
group = "games"
kind = "compose"
needs = { cpu = 4, ram_gib = 8, disk_gib = 30 }
ports = [8080, 2022, 25565]
provides = ["game-node"]
notes = "The default template is Minecraft Paper on 25565; the panel adds others."

# ------------------------------------------------------------------ Media
# Jellyfin and Plex both provide media-library and can run side by side: the arr apps and
# Pinchflat depend on the role, so either one (or both) satisfies them. The YouTube library and
# the playlist sync are set up on every media server that's ticked.
[service.jellyfin]
title = "Jellyfin"
summary = "your films, shows and music, streamed to any screen (GPU transcoding when there is one); open source, no account"
group = "media"
kind = "compose"
needs = { cpu = 4, ram_gib = 4, disk_gib = 20, gpu = "none" }
ports = [8096]
provides = ["media-library"]
exposes = "media"
storage = ["media"]
mounts = { "/config" = "state", "/cache" = "scratch", "/media" = "media" }
env = { TZ = "{tz}" }
source = { type = "jellyfin", token_ref = "{secret:jellyfin-api-key}" }

[[service.jellyfin.configure]]
do = "first-run"
summary = "finish Jellyfin's startup wizard: an admin user with a generated password"
secret = "jellyfin-admin"

[[service.jellyfin.configure]]
do = "secret"
name = "jellyfin-api-key"
summary = "an API key for the desktop and the playlist sync (Dashboard › API Keys)"

[[service.jellyfin.configure]]
do = "library"
name = "Films"
type = "movies"
path = "{media}/movies"

[[service.jellyfin.configure]]
do = "library"
name = "Shows"
type = "shows"
path = "{media}/tv"

[[service.jellyfin.configure]]
do = "library"
name = "Music"
type = "music"
path = "{media}/music"

[service.plex]
title = "Plex"
summary = "Plex Media Server: your library in the Plex apps on any TV or phone. Needs a free Plex account: you sign in once during setup"
group = "media"
kind = "helm"
image = "plexinc/pms-docker:1.43.4.10903-e5521bd8c"
chart = { repo = "https://raw.githubusercontent.com/plexinc/pms-docker/gh-pages", name = "plex-media-server", version = "1.9.0" }
needs = { cpu = 4, ram_gib = 4, disk_gib = 20, gpu = "none" }
ports = [32400]
provides = ["media-library"]
exposes = "plex"
storage = ["media"]
# Plex's database wants a disk with file locking: never a network share
mounts = { "/config" = "state", "/transcode" = "scratch", "/data" = "media" }
env = { TZ = "{tz}", PLEX_CLAIM = "{secret:plex-claim}" }
account = "plex"
source = { type = "plex", token_ref = "{secret:plex-token}" }
notes = "GPU transcoding needs Plex Pass, Plex's paid subscription. Without it, Plex transcodes on the CPU."

[[service.plex.configure]]
do = "sign-in"
provider = "plex"
summary = "sign in to your Plex account: enter the code shown at plex.tv/link. The account's token is kept as plex-token, and a claim token (plex-claim, valid a few minutes) adds the new server to your account"
secrets = ["plex-token", "plex-claim"]
before_start = true

[[service.plex.configure]]
do = "library"
name = "Films"
type = "movies"
path = "{media}/movies"

[[service.plex.configure]]
do = "library"
name = "Shows"
type = "shows"
path = "{media}/tv"

[[service.plex.configure]]
do = "library"
name = "Music"
type = "music"
path = "{media}/music"

[service.arr]
title = "The arr apps"
summary = "Sonarr, Radarr, Prowlarr and Bazarr: your library, organised and complete"
group = "media"
kind = "compose"
needs = { cpu = 2, ram_gib = 3, disk_gib = 10 }
ports = [8989, 7878, 9696, 6767]
provides = ["library-manager"]
depends = ["media-library"]
storage = ["media", "downloads"]
mounts = { "/config" = "state", "/media" = "media", "/downloads" = "downloads" }

[service.pinchflat]
title = "Pinchflat"
summary = "Downloads YouTube channels and playlists to your media library, so they play in Jellyfin or Plex and on the den TV."
group = "media"
kind = "compose"
# v2025.9.26 (plus upstream's yt-dlp fix for arm64): this build is published only as `latest`,
# so it's pinned by its digest
image = "ghcr.io/kieraneglin/pinchflat:latest@sha256:01b4f98aabaf3f5fe394213f7a32578c9e84e42080f52e2f8334021a4473b202"
needs = { cpu = 1, ram_gib = 1, disk_gib = 2 }
ports = [8945]
provides = ["youtube-downloader"]
depends = ["media-library"]
exposes = "youtube"
storage = ["media"]
# its SQLite database stays on the box: Pinchflat warns against a network share for /config
mounts = { "/config" = "state", "/downloads" = "media:youtube" }
# ENABLE_PROMETHEUS: its /metrics carries the download queue the console shows
env = { TZ = "{tz}", ENABLE_PROMETHEUS = "true" }
source = { type = "pinchflat", route_token_ref = "{secret:pinchflat-route-token}", metrics = "endpoint" }

[[service.pinchflat.configure]]
do = "folder"
path = "{media}/youtube"

[[service.pinchflat.configure]]
do = "library"
on = "media-library"            # on every ticked media server: Jellyfin, Plex, or both
name = "YouTube"
type = "shows"
path = "{media}/youtube"

[[service.pinchflat.configure]]
do = "setting"
app = "pinchflat"
kind = "media_profile"
summary = "for channels: a season per year, episodes by upload date"
[service.pinchflat.configure.values]
name = "Channel (a season per year)"
output_path_template = "/{{ source_custom_name }}/{{ season_by_year__episode_by_date_and_index }} - {{ title }} [{{ id }}].{{ ext }}"
preferred_resolution = "1080p"
download_subs = true
embed_subs = true
sub_langs = "en"
download_thumbnail = true
embed_thumbnail = true
embed_metadata = true
download_nfo = true
download_source_images = true
shorts_behaviour = "exclude"
livestream_behaviour = "exclude"
redownload_delay_days = 1

[[service.pinchflat.configure]]
do = "setting"
app = "pinchflat"
kind = "media_profile"
summary = "for playlists: Season 1, each video numbered by its place in the playlist (the sync orders by it)"
[service.pinchflat.configure.values]
name = "Playlist (in playlist order)"
output_path_template = "/{{ source_custom_name }}/{{ static_season__episode_by_index }} - {{ title }} [{{ id }}].{{ ext }}"
preferred_resolution = "1080p"
download_subs = true
embed_subs = true
sub_langs = "en"
download_thumbnail = true
embed_thumbnail = true
embed_metadata = true
download_nfo = true
download_source_images = true
shorts_behaviour = "include"
livestream_behaviour = "exclude"
redownload_delay_days = 1

[[service.pinchflat.configure]]
do = "secret"
name = "pinchflat-route-token"
summary = "Pinchflat's route token (in the OPML link on its Sources page): the console and the sync list sources with it"

[[service.pinchflat.configure]]
do = "timer"
name = "youtube-playlists"
summary = "every hour, bromigos lab youtube sync: each downloaded YouTube playlist becomes an ordered playlist in Jellyfin and Plex"
every = "1h"
# the sync is one file with no dependencies (homelab/lib/bromigos_homelab/youtube.py): a systemd
# timer runs it on a Linux box, a CronJob on Kubernetes
run = "python3 youtube.py sync"
[service.pinchflat.configure.env]
PINCHFLAT_URL = "{url:pinchflat}"
PINCHFLAT_ROUTE_TOKEN = "{secret:pinchflat-route-token}"
JELLYFIN_URL = "{url:jellyfin}"
JELLYFIN_TOKEN = "{secret:jellyfin-api-key}"
PLEX_URL = "{url:plex}"
PLEX_TOKEN = "{secret:plex-token}"
YOUTUBE_LIBRARY = "YouTube"

