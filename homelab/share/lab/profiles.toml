# The lab's service catalog and its presets: what `bromigos lab provision` (Phase 3) can set
# up on a user's own box, and how each is sized. docs/lab-provision.md has the design.
#
# Installed as /usr/share/bromigos/homelab/lab/profiles.toml (bromigos-homelab). Extensions
# add entries with the same schema (a homelab-adapter extension's lab/catalog/*.toml); the
# first entry of a name wins, so an extension adds services and never replaces one.
#
# [service.<id>]       one service the picker can tick
#   title, summary     its name and one line (the picker's row and hover hint)
#   group              core | ai | games | media | home | advanced | network (where it's listed)
#   kind               compose (a container on a Linux box) | host (installed on the host) |
#                      helm (on a Kubernetes target; compose elsewhere) | cluster (Kubernetes itself)
#   needs              { cpu = cores, ram_gib, disk_gib, vram_gib, gpu = "none"|"nvidia"|"amd"|"any" }
#                      the least it runs with; vram_gib with gpu = "none" means "a GPU helps"
#   ports              [ports it listens on]; only the reverse proxy is published (safety defaults)
#   provides           roles it fills (another service's depends names a role or a service)
#   depends            [roles or services it needs]; the picker ticks one for you and says why
#   conflicts          [services that can't run beside it in the same role]
#   default            true: ticked for everyone (Core); unticking says what's lost
#   models             { from = "catalog", capabilities = [...] }: its model set comes from the
#                      model catalog (models.toml, docs/lab-models.md), picked by VRAM tier
#   exposes            the web UI behind the reverse proxy (a subdomain), if any
#   gpu_driver         true: it needs the NVIDIA container toolkit (or ROCm), installed with a dry run first
#   image              the container image, pinned to a version (or a digest); `lab update` bumps it
#   chart              { repo, name, version }: the Helm chart on a Kubernetes target
#   storage            [purposes from [storage]] it keeps files on: media, downloads, backups
#   mounts             { container path = "media" | "media:<folder>" | "downloads" | "backups" |
#                        "state" | "scratch" }; state and scratch stay on the box's own disk
#   env                { NAME = value } for its container (placeholders below)
#   account            an account it signs in to during setup (bromigos_account: "plex")
#   source             the homelab.toml source the Verify step writes, so the console reads it
#   [[service.<id>.configure]]
#                      steps applied after it starts, in order (docs/lab-provision.md, "Configure
#                      steps"): do = "folder" | "first-run" | "secret" | "sign-in" | "library" |
#                      "setting" | "timer"
#
#   Placeholders in env, source and configure: {tz} the box's time zone; {media}, {downloads},
#   {backups} where that purpose's share is mounted; {url:<service>} a service's address on the
#   box; {secret:<name>} a generated secret (sops, or Vault). Pinchflat's own {{ … }} templates
#   are left alone. An env value naming a service that isn't ticked is left out.
#
# [preset.<id>]        a named selection over the catalog; picking it ticks its services, then
#                      anything can be added or removed (presets and Custom are the same screen)
#   services           ticked when the preset is picked
#   offered            listed with the preset but not ticked (Plex in Media)
#
# [storage]            the NAS you already have: what each purpose holds, the folders made on it,
#                      how it's mounted, and what each NAS brand needs (docs/lab-provision.md, "Storage")
#
# [sizing]             the rules the inventory applies (VRAM tiers: cpu, 8, 12, 16, 24, 32, 48, 80 GB)

format = 1

# ------------------------------------------------------------------ Core (always offered, ticked)
[service.caddy]
title = "Caddy"
summary = "the reverse proxy: automatic HTTPS for every web UI, the only thing exposed"
group = "core"
kind = "compose"
needs = { cpu = 1, ram_gib = 0.25, disk_gib = 1 }
ports = [80, 443]
provides = ["reverse-proxy"]
default = true

[service.netdata]
title = "Netdata"
summary = "live metrics for the box and its containers, no setup (the desktop reads it)"
group = "core"
kind = "compose"
needs = { cpu = 1, ram_gib = 0.5, disk_gib = 2 }
ports = [19999]
provides = ["metrics", "host-monitor"]
exposes = "netdata"
default = true

[service.restic]
title = "Backups (restic)"
summary = "nightly, encrypted, deduplicated backups of the lab's data to a NAS or a cloud bucket"
group = "core"
kind = "compose"
needs = { cpu = 1, ram_gib = 0.5, disk_gib = 1 }
ports = []
provides = ["backups"]
storage = ["backups"]
mounts = { "/repository" = "backups:restic" }
default = true
untick_warning = "Without backups, a dead disk loses the lab's data, models' settings and your services' state."

[service.homepage]
title = "Homepage"
summary = "one page with every service's link and status"
group = "core"
kind = "compose"
needs = { cpu = 1, ram_gib = 0.25, disk_gib = 1 }
ports = [3000]
provides = ["dashboard"]
exposes = "home"
default = true

# ------------------------------------------------------------------ AI
[service.ollama]
title = "Ollama"
summary = "run open LLMs on CPU or any GPU, pulled by name; the simple LLM server"
group = "ai"
kind = "compose"
needs = { cpu = 4, ram_gib = 8, disk_gib = 30, vram_gib = 8, gpu = "none" }
ports = [11434]
provides = ["llm-server"]
conflicts = ["vllm"]
models = { from = "catalog", capabilities = ["llm", "code", "embed", "vision"] }

[service.vllm]
title = "vLLM"
summary = "fast LLM serving on NVIDIA with 24 GB or more: batching, long contexts, many users"
group = "ai"
kind = "compose"
needs = { cpu = 8, ram_gib = 32, disk_gib = 80, vram_gib = 24, gpu = "nvidia" }
ports = [8000]
provides = ["llm-server"]
conflicts = ["ollama"]
gpu_driver = true
models = { from = "catalog", capabilities = ["llm", "code", "embed", "vision"] }

[service.litellm]
title = "LiteLLM"
summary = "one OpenAI-compatible gateway with keys in front of your LLM servers (VECTOR's brain uses it)"
group = "ai"
kind = "compose"
needs = { cpu = 2, ram_gib = 1, disk_gib = 2 }
ports = [4000]
provides = ["llm-gateway"]
depends = ["llm-server"]

[service.comfyui]
title = "ComfyUI"
summary = "images, edits, cutouts and 3D on your GPU (bromigos art and lab jobs run here)"
group = "ai"
kind = "compose"
needs = { cpu = 4, ram_gib = 16, disk_gib = 60, vram_gib = 12, gpu = "nvidia" }
ports = [8188]
provides = ["media-server"]
gpu_driver = true
exposes = "comfyui"
models = { from = "catalog", capabilities = ["image", "image-edit", "cutout", "upscale", "3d", "video"] }

[service.voice]
title = "Voice"
summary = "speech for VECTOR and voice jobs: Qwen3-TTS on a GPU, Kokoro on CPU"
group = "ai"
kind = "compose"
needs = { cpu = 2, ram_gib = 4, disk_gib = 10, vram_gib = 6, gpu = "none" }
ports = [7860]
provides = ["tts"]
models = { from = "catalog", capabilities = ["tts"] }
notes = "With a GPU of 8 GB or more: Qwen3-TTS (voice cloning, streamed); without: Kokoro on the CPU."

[service.whisper]
title = "Whisper"
summary = "speech to text for VECTOR's hearing and transcription jobs (served with the voice service)"
group = "ai"
kind = "compose"
needs = { cpu = 2, ram_gib = 2, disk_gib = 4, vram_gib = 2, gpu = "none" }
ports = []
provides = ["stt"]
depends = ["voice"]
models = { from = "catalog", capabilities = ["stt"] }

[service.open-webui]
title = "Open WebUI"
summary = "a chat UI for your models, in the browser"
group = "ai"
kind = "compose"
needs = { cpu = 1, ram_gib = 1, disk_gib = 4 }
ports = [8080]
provides = ["chat-ui"]
depends = ["llm-server"]
exposes = "chat"

[service.searxng]
title = "SearXNG"
summary = "private web search for VECTOR and Open WebUI"
