env = "GITHUB_API_KEY"
docs = "https://docs.github.com/rest"
api_base = "https://api.github.com"
auth_header = "Authorization: Bearer ${GITHUB_API_KEY}"
summary = "Repos, issues, pull requests, actions."
note = "GitHub is also listed as a one-click connector."

[[platform]]
id = "jina"
name = "Jina"
category = "Developer Tools"
env = "JINA_API_KEY"
docs = "https://jina.ai/reader/"
api_base = "https://r.jina.ai"
summary = "Cleaner page-text extraction: pages come back as readable text instead of raw HTML."
note = "Jina's keyless tier no longer works: every request needs a key."

[[platform]]
id = "porkbun"
name = "Porkbun"
category = "Developer Tools"
env = "PORKBUN_API_KEY"
docs = "https://porkbun.com/api/json/v3/documentation"
api_base = "https://api.porkbun.com/api/json/v3"
aliases = ["domains", "dns", "domain registration"]
summary = "Domain search, registration, DNS, and portfolio management."
note = """Porkbun wants BOTH an apikey and secretapikey in the JSON request body — so it needs a second \
secret beside PORKBUN_API_KEY. Enable API access per domain in the Porkbun dashboard."""

# ---- platforms: AI & Media

[[platform]]
id = "bannerbear"
name = "Bannerbear"
category = "AI & Media"
env = "BANNERBEAR_API_KEY"
docs = "https://developers.bannerbear.com/"
api_base = "https://api.bannerbear.com/v2"
auth_header = "Authorization: Bearer ${BANNERBEAR_API_KEY}"
aliases = ["auto design", "image generation", "templates", "social graphics"]
summary = "Templated image/design rendering at scale — product mockups, social graphics, thumbnails."

[[platform]]
id = "bland"
name = "Bland"
category = "AI & Media"
env = "BLAND_API_KEY"
docs = "https://docs.bland.ai/"
api_base = "https://api.bland.ai/v1"
aliases = ["ai phone", "phone calls", "voice agent", "call automation"]
summary = "AI phone calls: place and manage automated voice calls — a phone-answering service by API."
note = """The raw key rides the authorization header with no Bearer prefix (see docs). Calls dial real \
phones — test on your own number first."""
acts = "It can place calls to real phones."

[[platform]]
id = "deepl"
name = "DeepL"
category = "AI & Media"
env = "DEEPL_API_KEY"
docs = "https://developers.deepl.com/docs"
api_base = "https://api-free.deepl.com/v2"
auth_header = "Authorization: DeepL-Auth-Key ${DEEPL_API_KEY}"
aliases = ["translation", "translate", "localization"]
summary = "High-quality machine translation — a translation-agency workflow."
note = "Free-tier keys use api-free.deepl.com; paid keys use api.deepl.com."

[[platform]]
id = "elevenlabs"
name = "ElevenLabs"
category = "AI & Media"
env = "ELEVENLABS_API_KEY"
docs = "https://elevenlabs.io/docs/api-reference/introduction"
api_base = "https://api.elevenlabs.io/v1"
auth_header = "xi-api-key: ${ELEVENLABS_API_KEY}"
aliases = ["voice", "tts", "voiceover", "audiobook", "narration"]
summary = "Voice generation: narration, voiceovers, audiobooks, dubbing."

[[platform]]
id = "heygen"
name = "HeyGen"
category = "AI & Media"
env = "HEYGEN_API_KEY"
docs = "https://docs.heygen.com/"
api_base = "https://api.heygen.com"
auth_header = "X-Api-Key: ${HEYGEN_API_KEY}"
aliases = ["avatar video", "spokesperson", "talking head", "video generation"]
summary = "Avatar spokesperson videos: generate presenter videos from a script."

[[platform]]
id = "shotstack"
name = "Shotstack"
category = "AI & Media"
env = "SHOTSTACK_API_KEY"
docs = "https://shotstack.io/docs/api/"
api_base = "https://api.shotstack.io/edit/v1"
auth_header = "x-api-key: ${SHOTSTACK_API_KEY}"
aliases = ["video editing", "video render", "shorts", "video automation"]
summary = "Programmatic video editing: assemble and render videos from JSON timelines."
note = """Use the stage environment (api.shotstack.io/edit/stage) while testing — stage renders are free \
