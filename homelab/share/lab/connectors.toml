auth_header = "Authorization: Bearer ${PRINTIFY_API_KEY}"
aliases = ["pod", "print on demand", "merch", "marketplace products"]
summary = "Print-on-demand: shops, blueprints, products, orders, publishing."
note = "Create a personal access token under Printify → Settings → API."
api_notes = """Mockups are read-only and have no endpoint of their own: they are the images[] (src, \
variant_ids, position, is_default) of GET /v1/shops/{shop_id}/products/{product_id}.json. Upload artwork \
with POST /v1/uploads/images.json and {"file_name":"art.png","url":"https://..."} or \
{"file_name":"art.png","contents":"<the file, base64>"}; read it back with GET /v1/uploads/{image_id}.json. \
Update with PUT /v1/shops/{shop_id}/products/{product_id}.json: a partial document is accepted, but if you \
send variants, EVERY variant of the product must be in the request. A product is locked while publishing \
(is_locked); POST .../products/{product_id}/publishing_succeeded.json or publishing_failed.json unlocks it. \
Variant catalog: GET /v1/catalog/blueprints/{blueprint_id}/print_providers/{print_provider_id}/variants.json \
(?show-out-of-stock=1 includes out-of-stock). Ids are opaque strings (e.g. 5de6593ebff03b5313567d22): copy \
them exactly from a response, never retype or shorten them. Limits: 600 requests/min, catalog 100/min, \
publishing 200 per 30 min. Product documents are large: read only the fields you need, such as id, \
variants[].id, variants[].is_enabled, variants[].price, print_areas and images[].src."""

