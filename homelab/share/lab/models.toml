[capability.llm]
title = "LLM chat and tools"
service = "llm"
residency = "always"
unit = "tok/s"
scale = "bandwidth"
notes = "VECTOR's brain and the lab's agents: tool calling, long context. Served by vLLM or SGLang (many clients), llama.cpp or Ollama (GGUF, CPU, Apple), MLX on Macs."
quality_basis = "50 + Artificial Analysis Intelligence Index (Oct 2026)"

[capability.code]
title = "Coding LLM"
residency = "demand"
unit = "tok/s"
scale = "bandwidth"
notes = "Optional: agentic coding, and small FIM models for autocomplete."
quality_basis = "SWE-bench Pro, Terminal-Bench 2.1 and LiveCodeBench, relative"

[capability.embed]
title = "Embeddings"
residency = "always"
unit = "k tok/s"
scale = "compute"
notes = "VECTOR's memory and the lab's search. Changing the model means re-indexing."
quality_basis = "MTEB Multilingual v2 and RTEB, relative"

[capability.image]
title = "Image generation"
service = "image.generate"
residency = "demand"
unit = "s/image"
better = "lower"
scale = "compute"
notes = "ComfyUI workflows; the text encoder's size often decides the fit (it unloads after encoding)."
quality_basis = "50 + (LMArena text-to-image Elo - 1000) / 5"

[capability.image-edit]
title = "Image editing"
service = "image.edit"
residency = "demand"
unit = "s/image"
better = "lower"
scale = "compute"
notes = "Instruction, masked and multi-reference edits. Reference images add tokens: a little more VRAM and time than generation."
quality_basis = "50 + (LMArena single-image edit Elo - 1100) / 6"

[capability.cutout]
title = "Background removal"
service = "image.cutout"
residency = "demand"
unit = "s/image"
better = "lower"
scale = "compute"
notes = "Light: everything good fits 8 GB; more VRAM only adds batch throughput."
quality_basis = "Lucida's 203-image MAE benchmark and BiRefNet's model zoo"

[capability.upscale]
title = "Upscaling"
service = "image.upscale"
residency = "demand"
unit = "s/image"
better = "lower"
scale = "compute"
notes = "Image restoration and upscaling (SeedVR2 also does video)."
quality_basis = "Comfy Org's upscaling handbook, relative"

[capability.video]
title = "Video (loops, image and text to video)"
service = "video.loop"
residency = "demand"
unit = "min/clip"
better = "lower"
scale = "compute"
notes = "bromigOS's main use is seamless loops from a still (start frame = end frame): models with a native first-and-last-frame input rank first."
quality_basis = "loops from a still first (native first and last frame), then the AA video arena"

[capability.3d]
title = "Image to 3D"
service = "model3d.generate"
residency = "demand"
unit = "s/mesh"
better = "lower"
scale = "compute"
notes = "Textured (PBR) GLB first; shape-only is faster and lighter."
quality_basis = "Comfy Org and community comparisons (no neutral benchmark), textured PBR first"

[capability.tts]
title = "Text to speech"
service = "voice.tts"
residency = "always"
unit = "x realtime"
scale = "bandwidth"
notes = "VECTOR's voice: voice design, cloning and low-latency streaming. Ready means the voice service runs it today."
quality_basis = "AA speech arena (open weights) where listed, else vendor evaluations; design, cloning and streaming"

[capability.stt]
title = "Speech to text"
service = "voice.stt"
residency = "always"
unit = "x realtime"
scale = "compute"
notes = "VECTOR's hearing: dictation and commands."
quality_basis = "100 - 2.5 x word error rate (Open ASR Leaderboard, 8 public English sets)"

[capability.ocr]
title = "OCR and document parsing"
residency = "demand"
unit = "s/page"
better = "lower"
scale = "compute"
notes = "Pages to Markdown: small specialists beat big VLMs on page-to-Markdown; a big VLM is better for questions about documents."
quality_basis = "OmniDocBench v1.6 and olmOCR-bench, relative"

[capability.vision]
title = "Screen understanding"
residency = "always"
unit = "tok/s"
scale = "bandwidth"
notes = "'Look at my screen': describe, read and point at UI. A natively multimodal LLM serves it with no extra VRAM."
quality_basis = "OSWorld-Verified, ScreenSpot-Pro and MMMU-Pro, relative"

