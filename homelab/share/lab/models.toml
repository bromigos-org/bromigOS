# The bromigOS lab model catalog (docs/lab-models.md): for every AI capability, the best open
# models a machine can run. Facts per model variant: peak VRAM (all GPUs together; `gpus` when it
# needs several), RAM, speed on a reference card (`speed_ref`, a [gpu] below), quality 0-100 within
# its capability (the basis is each capability's `quality_basis`), the licence, the runtime and
# whether bromigOS's stack runs it (`stack`: ready | needs support: what). The picks are computed
# from these (bromigos_homelab.catalog): edit facts here, never picks.
#
# Researched 2026-10-09 from model cards, Hugging Face, LMArena, Artificial Analysis, the Open ASR
# and MTEB leaderboards, OmniDocBench and olmOCR-bench, vendor and community benchmarks (each
# model's `cite`). Figures marked est. in vram_note are computed, not measured.
format = 1
version = 2
researched = "2026-10-09"
refreshed = "2026-10-09"

