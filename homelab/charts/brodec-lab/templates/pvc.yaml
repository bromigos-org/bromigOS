{{- if not .Values.persistence.existingClaim }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "brodec-lab.fullname" . }}-data
  labels: {{- include "brodec-lab.labels" . | nindent 4 }}
  annotations:
    # Uninstalling keeps the bridge's identity: reinstall and it carries on, paired.
    helm.sh/resource-policy: keep
spec:
  accessModes: ["ReadWriteOnce"]
  {{- with .Values.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
{{- end }}
