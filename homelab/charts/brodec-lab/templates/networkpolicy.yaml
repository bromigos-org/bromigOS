{{- if .Values.networkPolicy.enabled }}
{{- $ports := list }}
{{- range (list .Values.sources.prometheusUrl .Values.sources.alertmanagerUrl .Values.sources.labApi.url .Values.brain.url) }}
{{- if . }}{{ $ports = append $ports (include "brodec-lab.port" . | int) }}{{ end }}
{{- end }}
{{- $ports = without (uniq $ports) 443 }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "brodec-lab.fullname" . }}
  labels: {{- include "brodec-lab.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "brodec-lab.selector" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  # Nothing connects to it.
  ingress: []
  egress:
    # DNS
    - ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    # HTTPS: BRODEC's homeserver and sign-in, and any HTTPS source or brain.
    - ports:
        - { protocol: TCP, port: 443 }
    {{- if $ports }}
    # The sources and the brain, on their own ports.
    - ports:
        {{- range $ports }}
        - { protocol: TCP, port: {{ . }} }
        {{- end }}
    {{- end }}
    {{- with .Values.networkPolicy.extraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
