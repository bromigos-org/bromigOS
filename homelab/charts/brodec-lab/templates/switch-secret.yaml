{{- if .Values.switch.create }}
{{- $name := include "brodec-lab.switchSecret" . }}
{{- /* Its value is the lab's to change (README.md): an upgrade keeps whatever is there. */}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "brodec-lab.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if and $existing $existing.data (hasKey $existing.data "on") }}
  "on": {{ index $existing.data "on" }}
  {{- else }}
  "on": ""
  {{- end }}
{{- end }}
