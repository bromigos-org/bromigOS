{{- $full := include "brodec-lab.fullname" . -}}
{{- $guest := include "brodec-lab.guestBrain" . | fromYaml -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $full }}
  labels: {{- include "brodec-lab.labels" . | nindent 4 }}
spec:
  replicas: 1
  # One Matrix device, one store: never two pods at once.
  strategy:
    type: Recreate
  selector:
    matchLabels: {{- include "brodec-lab.selector" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "brodec-lab.labels" . | nindent 8 }}
      {{- if or .Values.podAnnotations .Values.mediaServer.enabled }}
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if .Values.mediaServer.enabled }}
        checksum/mediamtx: {{ include (print $.Template.BasePath "/media-configmap.yaml") . | sha256sum }}
        {{- end }}
      {{- end }}
    spec:
      # It reads; it never talks to the Kubernetes API.
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bridge
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["run"]
          env:
            - { name: BRODEC_LAB_NAME, value: {{ include "brodec-lab.labName" . | quote }} }
            - { name: BRODEC_HOMESERVER, value: {{ .Values.homeserver | quote }} }
            # A folder of its own: some volumes' root belongs to root, and the bridge keeps
            # its folders owner-only.
            - { name: BRODEC_DATA_DIR, value: /data/bridge }
            # Not subPath: the kubelet refreshes the file when the Secret changes.
            - { name: BRODEC_SWITCH_ON_FILE, value: /run/switch/on }
            {{- with .Values.sources.prometheusUrl }}
            - { name: BRODEC_LAB_PROMETHEUS_URL, value: {{ . | quote }} }
            {{- end }}
            {{- with .Values.sources.alertmanagerUrl }}
            - { name: BRODEC_LAB_ALERTMANAGER_URL, value: {{ . | quote }} }
            {{- end }}
            {{- with .Values.sources.labApi.url }}
            - { name: BRODEC_LAB_API_URL, value: {{ . | quote }} }
            {{- end }}
            {{- if and .Values.sources.labApi.url .Values.sources.labApi.tokenSecret.name }}
            - { name: BRODEC_LAB_API_TOKEN_FILE, value: /run/secrets/lab-api/token }
            {{- end }}
            {{- with .Values.network.loginServer }}
            - { name: BRODEC_LAB_NETWORK_URL, value: {{ . | quote }} }
            {{- end }}
            {{- with .Values.network.name }}
            - { name: BRODEC_LAB_NETWORK_NAME, value: {{ . | quote }} }
            {{- end }}
            {{- with .Values.brain.url }}
            - { name: BRODEC_BRAIN_URL, value: {{ . | quote }} }
            {{- end }}
            {{- with .Values.brain.model }}
            - { name: BRODEC_BRAIN_MODEL, value: {{ . | quote }} }
            {{- end }}
            {{- if and .Values.brain.url .Values.brain.keySecret.name }}
            - { name: BRODEC_BRAIN_KEY_FILE, value: /run/secrets/brain/key }
            {{- end }}
            {{- with .Values.mediaServer }}
            {{- if .enabled }}
            # BROADCAST: the media server beside it, on the pod's loopback (mediamtx below).
            - { name: BRODEC_STREAM_API_URL, value: "http://127.0.0.1:9997" }
            - { name: BRODEC_STREAM_AUTH_LISTEN, value: "127.0.0.1:9108" }
            - { name: BRODEC_STREAM_WEBRTC_URL, value: "http://127.0.0.1:8889" }
            - { name: BRODEC_STREAM_HOST, value: {{ .host | quote }} }
            {{- if and .consoles.enabled .consoleHost }}
            - { name: BRODEC_STREAM_LAN_HOST, value: {{ .consoleHost | quote }} }
            {{- end }}
            - { name: BRODEC_STREAM_MAX_STREAMS, value: {{ .maxStreams | quote }} }
            - { name: BRODEC_STREAM_MAX_VIEWERS, value: {{ .maxViewers | quote }} }
            - { name: BRODEC_STREAM_TRANSCODE, value: {{ .transcode | default "none" | quote }} }
            {{- if .guests }}
            - { name: BRODEC_STREAM_GUESTS, value: "on" }
            {{- end }}
            {{- if .relay.turnUrl }}
            - { name: BRODEC_STREAM_RELAY, value: "on" }
            {{- end }}
            {{- if .recording.existingClaim }}
            - { name: BRODEC_STREAM_RECORD, value: "on" }
            {{- end }}
            {{- end }}
            {{- end }}
            {{- with $guest }}
            {{- if .url }}
            # Guests' brain: never `brain` unless guestBrain.sameAsBrain says so.
            - { name: BRODEC_GUEST_BRAIN_URL, value: {{ .url | quote }} }
            - { name: BRODEC_GUEST_BRAIN_MODEL, value: {{ required "guestBrain.model (or brain.model with sameAsBrain) is needed with a guest brain" .model | quote }} }
            {{- if .keySecret.name }}
            - { name: BRODEC_GUEST_BRAIN_KEY_FILE, value: /run/secrets/guest-brain/key }
            {{- end }}
            {{- end }}
            {{- end }}
          # Until it is paired, it waits for its owner: the log shows the pairing code.
          startupProbe:
            exec: { command: ["/usr/local/bin/brodec-lab", "health"] }
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            exec: { command: ["/usr/local/bin/brodec-lab", "health"] }
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 4
          readinessProbe:
            exec: { command: ["/usr/local/bin/brodec-lab", "health", "--ready"] }
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources: {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: tmp, mountPath: /tmp }
            - { name: switch, mountPath: /run/switch, readOnly: true }
            {{- if and .Values.sources.labApi.url .Values.sources.labApi.tokenSecret.name }}
            - { name: lab-api, mountPath: /run/secrets/lab-api, readOnly: true }
            {{- end }}
            {{- if and .Values.brain.url .Values.brain.keySecret.name }}
            - { name: brain, mountPath: /run/secrets/brain, readOnly: true }
            {{- end }}
            {{- if and $guest.url $guest.keySecret.name }}
            - { name: guest-brain, mountPath: /run/secrets/guest-brain, readOnly: true }
            {{- end }}
        {{- with .Values.mediaServer }}
        {{- if .enabled }}
        # The media server (MediaMTX). Its control API and its questions to the bridge stay on
        # the pod's loopback; only the media ports listen on the pod's network.
        - name: mediamtx
          image: {{ include "brodec-lab.mediamtxImage" $ | quote }}
          imagePullPolicy: {{ .image.pullPolicy }}
          args: ["/etc/mediamtx/mediamtx.yml"]
          workingDir: /work
          {{- if and .relay.turnUrl .relay.secret.name }}
          env:
            # The relay's shared secret, from its Secret, never in the ConfigMap.
            - name: MTX_WEBRTCICESERVERS2_0_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ .relay.secret.name | quote }}, key: {{ .relay.secret.key | quote }} }
          {{- end }}
          ports:
            {{- range (include "brodec-lab.mediaPorts" $ | fromYamlArray) }}
            - { name: {{ .name }}, containerPort: {{ .port }}, protocol: {{ .protocol }} }
            {{- end }}
          resources: {{- toYaml .resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - { name: mediamtx-config, mountPath: /etc/mediamtx, readOnly: true }
            - { name: mediamtx-work, mountPath: /work }
            {{- if .recording.existingClaim }}
            - { name: recordings, mountPath: /recordings }
            {{- end }}
        {{- if .tailnet.enabled }}
        # The media server's way in from your devices: this pod on your tailnet, in userspace
        # (no NET_ADMIN), forwarding only the media ports to the pod's loopback.
        - name: tailnet
          image: {{ .tailnet.image | quote }}
          imagePullPolicy: IfNotPresent
          env:
            - { name: TS_USERSPACE, value: "true" }
            - { name: TS_HOSTNAME, value: {{ .tailnet.hostname | quote }} }
            - { name: TS_STATE_DIR, value: /data/tailnet }
            - { name: TS_SOCKET, value: /tmp/tailscaled.sock }
            - name: TS_AUTHKEY
              valueFrom:
                secretKeyRef:
                  name: {{ required "mediaServer.tailnet.authKeySecret.name is needed with the tailnet" .tailnet.authKeySecret.name | quote }}
                  key: {{ .tailnet.authKeySecret.key | quote }}
            - name: TS_EXTRA_ARGS
              value: {{ printf "--login-server=%s" (required "mediaServer.tailnet.loginServer is needed with the tailnet" .tailnet.loginServer) | quote }}
            - { name: TS_SERVE_CONFIG, value: /tmp/serve.json }
            - name: TS_SERVE_JSON
              value: {{ include "brodec-lab.tailnetServe" $ | quote }}
          command: ["/bin/sh", "-c"]
          args:
            - printf '%s' "$TS_SERVE_JSON" > /tmp/serve.json && exec /usr/local/bin/containerboot
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 256Mi }
          volumeMounts:
            - { name: data, mountPath: /data/tailnet, subPath: tailnet }
            - { name: tailnet-tmp, mountPath: /tmp }
        {{- end }}
        {{- end }}
        {{- end }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim | default (printf "%s-data" $full) }}
        - name: tmp
          emptyDir: { sizeLimit: 256Mi }
        - name: switch
          secret:
            secretName: {{ include "brodec-lab.switchSecret" . }}
            defaultMode: 0400
            items: [{ key: "on", path: "on" }]
        {{- if and .Values.sources.labApi.url .Values.sources.labApi.tokenSecret.name }}
        - name: lab-api
          secret:
            secretName: {{ .Values.sources.labApi.tokenSecret.name }}
            defaultMode: 0400
            items: [{ key: {{ .Values.sources.labApi.tokenSecret.key | quote }}, path: token }]
        {{- end }}
        {{- if and .Values.brain.url .Values.brain.keySecret.name }}
        - name: brain
          secret:
            secretName: {{ .Values.brain.keySecret.name }}
            defaultMode: 0400
            items: [{ key: {{ .Values.brain.keySecret.key | quote }}, path: key }]
        {{- end }}
        {{- if .Values.mediaServer.enabled }}
        - name: mediamtx-config
          configMap:
            name: {{ $full }}-mediamtx
        - name: mediamtx-work
          emptyDir: { sizeLimit: 64Mi }
        {{- with .Values.mediaServer.recording.existingClaim }}
        - name: recordings
          persistentVolumeClaim:
            claimName: {{ . | quote }}
        {{- end }}
        {{- if .Values.mediaServer.tailnet.enabled }}
        - name: tailnet-tmp
          emptyDir: { sizeLimit: 16Mi }
        {{- end }}
        {{- end }}
        {{- if and $guest.url $guest.keySecret.name }}
        - name: guest-brain
          secret:
            secretName: {{ $guest.keySecret.name }}
            defaultMode: 0400
            items: [{ key: {{ $guest.keySecret.key | quote }}, path: key }]
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
