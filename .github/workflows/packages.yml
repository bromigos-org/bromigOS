# Build the packages in packaging/*/, sign them, add them to the signed
# pacman repo database and publish it to the repo's bucket
# (packaging/README.md). Pushes to main (edge), version tags (stable, rc) and manual runs publish;
# pull requests never run this.
name: packages

on:
  push:
    branches: [main]
    # a tag publishes the same build to the stable channel (vX.Y.Z) or the rc one
    # (vX.Y.Z-rcN); paths filters don't apply to tags
    tags: ["v*"]
    paths:
      - "core/**"
      - "themes/**"
      - "theme/**"
      - "live/**"
      - "widgets/**"
      - "desktop/**"
      - "homelab/**"
      - "settings/**"
      - "install.sh"
      - "bin/**"
      - "migrations/**"
      - "lib/**"
      - "packaging/**"
      - "apps/**"
      - "LICENSE-*"
      - "manual/**"
      - ".github/workflows/packages.yml"
  workflow_dispatch:
    inputs:
      hosted:
        description: "Run on GitHub's hosted runner, as once the repositories are public (docs/public.md)"
        type: boolean
        default: false
      rebuild:
        description: "Rebuild and republish even versions already in the repo"
        type: boolean
        default: false
      only:
        description: "Only these package directories (space-separated); empty = all"
        type: string
        default: ""
      channel:
        description: "The channel to publish to"
        type: choice
        options: [edge, rc, stable]
        default: edge
      mirror_only:
        description: "Build nothing: only bring the public mirror (R2) up to date with the channel"
        type: boolean
        default: false
      prefix:
        description: "A test: publish under this folder of the bucket (e.g. ci-test), not the real channels"
        type: string
        default: ""

# One publisher at a time per channel: each run reads, extends and rewrites the channel's db
# ... per channel: a tag's stable/rc publish must not be queued behind (or cancelled by: a
# group holds one pending run) the pushes to main; each channel has its own database and
# lease in the bucket, so they can run side by side.
concurrency:
  group: packages-${{ inputs.prefix && format('{0}-', inputs.prefix) || '' }}${{ inputs.channel || (startsWith(github.ref, 'refs/tags/v') && (contains(github.ref, '-rc') && 'rc' || 'stable')) || 'edge' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Build, sign and publish
    # The repo variable CI_RUNNER_PACKAGES names a self-hosted amd64 runner
    # that can reach the private bucket. The job's container runs in that runner's
    # Docker daemon, so it needs one sized for builds. Without the variable (or with
    # the hosted input) the job runs on GitHub's hosted runner and publishes to the
    # public bucket alone (PKGS_PRIMARY=public). A public repository must not set it
    # (tools/release/go-public.sh --ci unsets it).
    runs-on: ${{ !inputs.hosted && vars.CI_RUNNER_PACKAGES || 'ubuntu-latest' }}
    container:
      image: archlinux:base-devel
      # On a homelab runner, the node's shared cache (homelab helm/arc-runners:
      # /ci-cache in dockerd's filesystem): cargo's registry and bromigos-core's
      # target directory persist there (packaging/ci/prepare-container.sh).
      volumes: ${{ !inputs.hosted && vars.CI_RUNNER_PACKAGES && fromJSON('["/ci-cache:/ci-cache"]') || fromJSON('[]') }}
    timeout-minutes: 60
    steps:
      # git first, so actions/checkout makes a real clone (pkgver() reads history).
      - name: git
        run: pacman -Syu --noconfirm --needed git >/dev/null

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # A release tag publishes the stable or rc channel: only from a commit on main
      # (docs/release.md, "Guard rails"), however the tag was pushed.
      - name: A release tag is on main
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch -q origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) isn't on main: nothing is published from it"
            exit 1
          fi

      - name: Prepare the container
        run: packaging/ci/prepare-container.sh "$GITHUB_WORKSPACE"

      - name: Build, sign and publish
        env:
          PKGS_S3_ENDPOINT: ${{ secrets.PKGS_S3_ENDPOINT }}
          PKGS_S3_BUCKET: ${{ secrets.PKGS_S3_BUCKET }}
          PKGS_S3_ACCESS_KEY_ID: ${{ secrets.PKGS_S3_ACCESS_KEY_ID }}
          PKGS_S3_SECRET_ACCESS_KEY: ${{ secrets.PKGS_S3_SECRET_ACCESS_KEY }}
          PKGS_GPG_PRIVATE_KEY: ${{ secrets.PKGS_GPG_PRIVATE_KEY }}
          PKGS_GPG_PASSPHRASE: ${{ secrets.PKGS_GPG_PASSPHRASE }}
          # the public mirror (packaging/README.md, "The public mirror"); unset, publish.sh skips it
          PKGS_PUBLIC_ENDPOINT: ${{ secrets.PKGS_PUBLIC_ENDPOINT }}
          PKGS_PUBLIC_BUCKET: ${{ secrets.PKGS_PUBLIC_BUCKET }}
          PKGS_PUBLIC_ACCESS_KEY_ID: ${{ secrets.PKGS_PUBLIC_ACCESS_KEY_ID }}
          PKGS_PUBLIC_SECRET_ACCESS_KEY: ${{ secrets.PKGS_PUBLIC_SECRET_ACCESS_KEY }}
          PKGS_MIRROR_ONLY: ${{ inputs.mirror_only && '1' || '0' }}
          # the private bucket is the primary only where the job can reach it
          PKGS_PRIMARY: ${{ !inputs.hosted && vars.CI_RUNNER_PACKAGES && 's3' || 'public' }}
          PKGS_ROOT: ${{ inputs.prefix }}
          PKGS_KEEP: "3"
          PKGS_REBUILD: ${{ inputs.rebuild && '1' || '0' }}
          PKGS_ONLY: ${{ inputs.only }}
          # a vX.Y.Z tag -> stable, vX.Y.Z-rcN -> rc, a push to main -> edge, or as asked
          PKGS_CHANNEL: ${{ inputs.channel || (startsWith(github.ref, 'refs/tags/v') && (contains(github.ref, '-rc') && 'rc' || 'stable')) || 'edge' }}
        # sudo keeps only what --preserve-env names: the secrets reach
        # publish.sh through its environment, never its command line.
        run: >-
          sudo -u builder
          --preserve-env=PKGS_S3_ENDPOINT,PKGS_S3_BUCKET,PKGS_S3_ACCESS_KEY_ID,PKGS_S3_SECRET_ACCESS_KEY,PKGS_GPG_PRIVATE_KEY,PKGS_GPG_PASSPHRASE,PKGS_PUBLIC_ENDPOINT,PKGS_PUBLIC_BUCKET,PKGS_PUBLIC_ACCESS_KEY_ID,PKGS_PUBLIC_SECRET_ACCESS_KEY,PKGS_MIRROR_ONLY,PKGS_PRIMARY,PKGS_ROOT,PKGS_KEEP,PKGS_REBUILD,PKGS_ONLY,PKGS_CHANNEL,GITHUB_REPOSITORY,GITHUB_RUN_ID,CARGO_HOME,BROMIGOS_CARGO_TARGET_DIR
          packaging/ci/publish.sh
