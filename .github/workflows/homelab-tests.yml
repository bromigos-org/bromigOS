name: homelab tests
# The homelab package's unit tests on every PR that touches what they import. Before this they
# ran only in bromigos-homelab's check() during the packages run on main, so a PR could merge
# green and then stop the publish (#72's test_static_draws_rendered_art).
on:
  pull_request:
    paths:
      - "homelab/**"
      - "lib/**"
      # test_lab_backups.py restores from a backup the real bromigos-server makes
      - "server/bromigos-server"
      - "tests/mascot/**"
      - "packaging/bromigos-homelab/**"
      - ".github/workflows/homelab-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: Homelab unit tests
    # GitHub's runner, never the lab's: this repo is public (forks' PRs run here)
    runs-on: ubuntu-latest
    container: archlinux:base
    timeout-minutes: 30
    steps:
      - name: tools
        # bromigos-homelab's makedepends and checkdepends (packaging/bromigos-homelab/PKGBUILD,
        # python-tomlkit for the catalog review's edits),
        # and rsync and restic, bromigos-lab's: the app data move's tests copy with the real
        # rsync, and test_lab_backups.py restores from a real repository
        run: >-
          pacman -Syu --noconfirm --needed git python python-textual desktop-file-utils
          python-cairo python-gobject pango python-psutil python-zeroconf python-tomlkit rsync restic >/dev/null
      - uses: actions/checkout@v5
      - name: unittest
        # as a normal user, like makepkg's check()
        run: |
          useradd -m builder
          chown -R builder "$GITHUB_WORKSPACE"
          su builder -c "cd '$GITHUB_WORKSPACE/homelab' && PYTHONPATH=lib python -m unittest discover -s tests"

  apps:
    name: Apps on a Server (Podman)
    # `bromigos lab apps` for real: Podman, Quadlet and systemd on a throwaway VM, as root. A
    # tiny recipe (BusyBox's web server, homelab/tests/fixtures/apps-integration) is added,
    # listed, removed keeping its data, added again (it finds the data), and removed with it.
    # Each add and remove is an activity job in a unit of its own. GitHub's runner, never the
    # lab's: this repo is public
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: podman and quadlet
        run: |
          podman --version
          ls /usr/lib/systemd/system-generators/ | grep -i podman
      - name: add, list, remove keeping data, add again, delete
        run: sudo CI=true bash homelab/tests/apps-integration.sh
      - name: what happened
        if: failure()
        run: |
          sudo python3 bin/bromigos-activity list --all || true
          for j in $(sudo ls /var/lib/bromigos/activity/jobs/ 2>/dev/null | grep '\.log$'); do
            echo "== $j"; sudo cat "/var/lib/bromigos/activity/jobs/$j"
          done
          sudo journalctl -u hello.service --no-pager -n 80 || true
          sudo cat /etc/containers/systemd/hello.container || true

  databases:
    name: App databases on a Server (Podman)
    # The database hooks' paths on the real apps (homelab/tests/apps-databases.sh): the engine
    # installs catalogue apps that keep SQLite databases, with their real images, and the hook it
    # wrote for each must copy that app's database once it answers. GitHub's runner, never the
    # lab's: this repo is public
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: room for the images
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h / | tail -1
      - name: each app's database, copied through its hook
        run: sudo CI=true bash homelab/tests/apps-databases.sh
      - name: what happened
        if: failure()
        run: |
          sudo python3 bin/bromigos-activity list --all || true
          for j in $(sudo ls /var/lib/bromigos/activity/jobs/ 2>/dev/null | grep '\.log$' | tail -6); do
            echo "== $j"; sudo tail -40 "/var/lib/bromigos/activity/jobs/$j"
          done
          sudo podman ps -a || true
