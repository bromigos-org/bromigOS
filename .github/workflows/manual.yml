# The end-user manual (manual/, mdBook): built on every change and published next to the
# packages at <repo>/bromigos/manual/ (docs/update.md "The manual"; homelab
# helm/bromigos-pkgs serves the bucket's bromigos/ at https://<host>/bromigos/). Pull
# requests only build. Each machine also has its own copy: the bromigos-manual package.
name: manual

on:
  push:
    branches: [main]
    paths: ["manual/**", ".github/workflows/manual.yml"]
  pull_request:
    paths: ["manual/**", ".github/workflows/manual.yml"]
  workflow_dispatch:
    inputs:
      hosted:
        description: "Run on GitHub's hosted runner, as once the repositories are public (docs/public.md)"
        type: boolean
        default: false
      prefix:
        description: "A test: publish under this folder of the bucket (e.g. ci-test)"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  manual:
    name: Build and publish
    runs-on: ${{ github.event_name != 'pull_request' && !inputs.hosted && vars.CI_RUNNER_PACKAGES || 'ubuntu-latest' }}
    container:
      image: archlinux:base-devel
    timeout-minutes: 15
    steps:
      - name: mdBook and rclone
        run: pacman -Syu --noconfirm --needed git mdbook rclone >/dev/null
      - uses: actions/checkout@v5
      - name: Build
        run: manual/publish.sh --build-only "$RUNNER_TEMP/book" && ls "$RUNNER_TEMP/book" | head
      - name: Publish
        if: github.event_name != 'pull_request'
        env:
          PKGS_S3_ENDPOINT: ${{ secrets.PKGS_S3_ENDPOINT }}
          PKGS_S3_BUCKET: ${{ secrets.PKGS_S3_BUCKET }}
          PKGS_S3_ACCESS_KEY_ID: ${{ secrets.PKGS_S3_ACCESS_KEY_ID }}
          PKGS_S3_SECRET_ACCESS_KEY: ${{ secrets.PKGS_S3_SECRET_ACCESS_KEY }}
          PKGS_PUBLIC_ENDPOINT: ${{ secrets.PKGS_PUBLIC_ENDPOINT }}
          PKGS_PUBLIC_BUCKET: ${{ secrets.PKGS_PUBLIC_BUCKET }}
          PKGS_PUBLIC_ACCESS_KEY_ID: ${{ secrets.PKGS_PUBLIC_ACCESS_KEY_ID }}
          PKGS_PUBLIC_SECRET_ACCESS_KEY: ${{ secrets.PKGS_PUBLIC_SECRET_ACCESS_KEY }}
          # as packages.yml: the private bucket only where the job can reach it
          PKGS_PRIMARY: ${{ !inputs.hosted && vars.CI_RUNNER_PACKAGES && 's3' || 'public' }}
          PKGS_ROOT: ${{ inputs.prefix }}
        run: manual/publish.sh
