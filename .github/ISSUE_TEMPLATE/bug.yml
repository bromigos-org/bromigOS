name: Something is broken
description: Report a bug in bromigOS.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting it. Leave out anything private, such as your hostnames, addresses or tokens.
        A security problem goes in a private report instead (SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, and what went wrong.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to make it happen again
      description: The steps, one per line. Say if it happens every time.
      placeholder: |
        1. Run `bromigos theme set mire`
        2. Press Super+W
        3. The panels don't appear
    validations:
      required: true
  - type: textarea
    id: about
    attributes:
      label: Your machine
      description: Paste the output of `bromigos about text`. It gives the version, channel and hardware.
      render: text
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or a picture
      description: An error message, a log or a screenshot, if you have one.
      render: text
